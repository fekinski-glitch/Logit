<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #000000);
      --hint-color: var(--tg-theme-hint-color, #999999);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
      --danger-color: #ff3b30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 16px 100px;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    #progress {
      font-size: 14px;
      color: var(--hint-color);
      margin-bottom: 24px;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .add-form input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      background-color: var(--secondary-bg-color);
      color: var(--text-color);
      font-size: 16px;
      outline: none;
      transition: box-shadow 0.2s;
    }

    .add-form input:focus {
      box-shadow: 0 0 0 2px var(--button-color);
    }

    .add-form button {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: none;
      background-color: var(--button-color);
      color: var(--button-text-color);
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .add-form button:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    #task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background-color: var(--secondary-bg-color);
      border-radius: 14px;
      transition: all 0.3s ease;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-item.done {
      opacity: 0.6;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--hint-color);
    }

    .task-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--hint-color);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .task-checkbox.checked {
      background-color: var(--button-color);
      border-color: var(--button-color);
    }

    .task-checkbox.checked::after {
      content: "✓";
      color: var(--button-text-color);
      font-size: 14px;
      font-weight: bold;
    }

    .task-text {
      flex: 1;
      font-size: 16px;
      line-height: 1.4;
      word-break: break-word;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--hint-color);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color 0.2s, background-color 0.2s;
    }

    .delete-btn:active {
      color: var(--danger-color);
      background-color: rgba(255, 59, 48, 0.1);
    }

    #empty-state {
      text-align: center;
      color: var(--hint-color);
      padding: 40px 20px;
      font-size: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Logit</h1>
  <p id="progress">Загрузка...</p>

  <div class="add-form">
    <input type="text" id="task-input" placeholder="Что нужно сделать?" maxlength="100">
    <button id="add-btn">+</button>
  </div>

  <ul id="task-list"></ul>
  <div id="empty-state">Пока нет задач. Добавь первую! 🚀</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let tasks = [];
    const STORAGE_KEY = 'my_tasks_v1';       // Ключ в облаке Telegram
    const FALLBACK_KEY = 'my_tasks_local_v1'; // Ключ в localStorage (запасной)

    const input = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('task-list');
    const progress = document.getElementById('progress');
    const emptyState = document.getElementById('empty-state');

    // --- 1. ЗАГРУЗКА ---
    async function loadTasks() {
      try {
        if (tg.CloudStorage && typeof tg.CloudStorage.getItem === 'function') {
          const saved = await tg.CloudStorage.getItem(STORAGE_KEY);
          if (saved) {
            tasks = JSON.parse(saved);
            console.log('Загружено из облака');
            render();
            return;
          }
        }
        const localSaved = localStorage.getItem(FALLBACK_KEY);
        if (localSaved) {
          tasks = JSON.parse(localSaved);
          console.log('Загружено из localStorage');
        }
      } catch (e) {
        console.error('Ошибка загрузки из облака, пробуем локально:', e);
        const localSaved = localStorage.getItem(FALLBACK_KEY);
        if (localSaved) tasks = JSON.parse(localSaved);
      }
      render();
    }

    // --- 2. СОХРАНЕНИЕ ---
    async function saveTasks() {
      try {
        localStorage.setItem(FALLBACK_KEY, JSON.stringify(tasks));
      } catch (e) {
        console.error('Ошибка локального сохранения:', e);
      }

      try {
        if (tg.CloudStorage && typeof tg.CloudStorage.setItem === 'function') {
          await tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          console.log('Сохранено в облако');
        }
      } catch (e) {
        console.warn('Облако не ответило, но данные уже в localStorage:', e);
      }
    }

    // --- 3. ОТРИСОВКА ---
    function render() {
      list.innerHTML = '';

      const doneCount = tasks.filter(t => t.done).length;
      if (tasks.length === 0) {
        progress.textContent = 'Добавь свою первую задачу';
      } else if (doneCount === tasks.length) {
        progress.textContent = 'Все задачи выполнены! 🎉';
      } else {
        progress.textContent = `Выполнено ${doneCount} из ${tasks.length}`;
      }

      emptyState.style.display = tasks.length === 0 ? 'block' : 'none';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.index = index;

        li.innerHTML = `
          <div class="task-checkbox ${task.done ? 'checked' : ''}"></div>
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="delete-btn">✕</button>
        `;

        li.querySelector('.task-checkbox').addEventListener('click', () => toggleTask(index));
        li.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteTask(index);
        });

        list.appendChild(li);
      });
    }

    // --- 4. ДОБАВЛЕНИЕ ---
    function addTask() {
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ text: text, done: false });
      input.value = '';
      render();
      saveTasks();
      tg.HapticFeedback.impactOccurred('light');
    }

    // --- 5. ПЕРЕКЛЮЧЕНИЕ ---
    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      render();
      saveTasks();
      tg.HapticFeedback.impactOccurred('medium');
    }

    // --- 6. УДАЛЕНИЕ ---
    function deleteTask(index) {
      tasks.splice(index, 1);
      render();
      saveTasks();
      tg.HapticFeedback.impactOccurred('rigid');
    }

    // --- 7. ЗАЩИТА ОТ XSS ---
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- 8. СОБЫТИЯ ---
    addBtn.addEventListener('click', addTask);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    // --- 9. ЗАПУСК ---
    loadTasks();
  </script>
</body>
</html>
