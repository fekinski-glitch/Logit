<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Logit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    /* ═══ 1. Палитра и переменные ═══ */
    :root {
      --bg-color: #F4F1EA; /* Тёплый кремовый */
      --text-color: #111111;
      --hint-color: #888888;
      
      --card-bg: #FFFFFF;
      --button-color: #111111;
      --button-text-color: #FFFFFF;
      --secondary-bg-color: #EBE7DF;
      
      --accent-red: #E52D27;
      --accent-green: #A3B899;
      --accent-yellow: #DFD870;
      --accent-brown: #BC9A7E;
      --accent-blue: #7B9EBE;
      --danger-color: #E52D27;

      --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

      --r-pill: 100px;
      --r-card: 24px;
      --r-sheet: 32px;
      --r-chip: 16px;

      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-7: 32px;
      --sp-8: 48px;

      --shadow-soft: 0 8px 24px rgba(0,0,0,0.06);
      --shadow-float: 0 12px 32px rgba(0,0,0,0.1);
      
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    body[data-theme="dark"] {
      --bg-color: #1C1B1A;
      --text-color: #F4F1EA;
      --hint-color: #777777;
      --card-bg: #2A2928;
      --button-color: #F4F1EA;
      --button-text-color: #111111;
      --secondary-bg-color: #333231;
      --shadow-soft: 0 8px 24px rgba(0,0,0,0.3);
      --shadow-float: 0 12px 32px rgba(0,0,0,0.5);
    }

    /* ═══ 2. Базовые стили ═══ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 16px;
      line-height: 1.4;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      overflow-x: hidden;
    }
    body.picker-open, body.welcome-open { overflow: hidden; }
    body.booting .view, body.booting .tab-bar { visibility: hidden; }

    ::placeholder { color: var(--hint-color); opacity: 1; }
    :focus-visible { outline: 2px solid var(--text-color); outline-offset: 2px; }

    /* ═══ 3. Views & Layout ═══ */
    .view {
      display: none;
      padding: 24px 20px 120px;
      min-height: 100vh;
      position: relative;
    }
    .view.active { display: block; }
    body.kb-open .view { padding-bottom: 20px; }

    /* ═══ 4. Header ═══ */
    .header-wrap {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    
    .pill {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: var(--text-color);
      background: none;
      border: none;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }
    .pill--interactive { cursor: pointer; transition: opacity 0.15s; }
    .pill--interactive:active { opacity: 0.5; }
    .pill .chevron { font-size: 16px; font-weight: 600; margin-top: 4px; }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--card-bg);
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.15s;
      box-shadow: var(--shadow-soft);
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; }

    .header-icon-btn, .to-today-btn { margin-top: 0; }
    .header-icon-btn { display: flex; }
    .to-today-btn { display: none; }

    /* ═══ 5. Календарь (Мягкие карточки) ═══ */
    .calendar-strip-wrap {
      position: relative;
      margin-bottom: 24px;
      margin-left: -20px; margin-right: -20px;
    }
    .calendar-strip {
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
      padding: 4px calc(50% - 32px);
    }
    .calendar-strip::-webkit-scrollbar { display: none; }

    .calendar-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg-color); color: var(--text-color);
      opacity: 0; pointer-events: none; z-index: 3;
      transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .calendar-arrow-left { left: 8px; }
    .calendar-arrow-right { right: 8px; }
    .calendar-strip-wrap.has-more-left .calendar-arrow-left,
    .calendar-strip-wrap.has-more-right .calendar-arrow-right { opacity: 1; pointer-events: auto; }
    .calendar-arrow svg { width: 16px; height: 16px; stroke: currentColor; }

    .day-cell {
      flex-shrink: 0; width: 60px; height: 76px; border-radius: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: var(--card-bg); border: none; cursor: pointer;
      scroll-snap-align: center; color: var(--text-color);
      box-shadow: var(--shadow-soft);
      transition: all 0.2s;
    }
    .day-cell:active { transform: scale(0.95); }
    .day-cell .weekday {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--hint-color); letter-spacing: 0.05em;
    }
    .day-cell .date-num {
      font-size: 20px; font-weight: 700; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
      transition: all 0.2s;
    }
    
    .day-cell.selected {
      background: var(--text-color);
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }
    .day-cell.selected .weekday { color: var(--bg-color); opacity: 0.7; }
    .day-cell.selected .date-num { background: transparent; color: var(--bg-color); }
    .day-cell.today:not(.selected) .date-num { color: var(--accent-red); }
    .day-dot { display: none; }

    /* ═══ 6. Форма добавления ═══ */
    .add-form {
      background: var(--card-bg);
      border-radius: var(--r-card);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 28px;
      display: flex; flex-direction: column; gap: 16px;
    }
    
    .add-form input[type="text"] {
      width: 100%; padding: 0; border: none;
      background: transparent; color: var(--text-color);
      font-family: inherit; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      outline: none; border-radius: 0;
    }
    .add-form input[type="text"]::placeholder { color: var(--hint-color); font-weight: 600; }

    .add-form-2 { display: flex; align-items: center; gap: 12px; }
    
    .cat-toggle {
      padding: 10px 16px; border-radius: var(--r-pill);
      background: var(--bg-color); color: var(--text-color);
      font-family: inherit; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; cursor: pointer; flex-shrink: 0;
      border: none;
    }
    .cat-toggle:active { opacity: 0.7; }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; }

    .time-btn-wrapper {
      flex: 1; position: relative; display: flex; align-items: center;
      background: var(--bg-color); border-radius: var(--r-pill); height: 40px; padding: 0 16px;
    }
    .time-btn-display {
      font-size: 13px; font-weight: 600; color: var(--text-color); pointer-events: none;
    }
    .time-btn-display:not(.has-value) { color: var(--hint-color); }
    .time-input-overlay { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

    #add-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: none; background: var(--text-color); color: var(--bg-color);
      font-size: 24px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s;
    }
    #add-btn:active { transform: scale(0.9); }

    /* ═══ 7. Список задач (Карточки как на референсе) ═══ */
    #task-sections { display: flex; flex-direction: column; gap: 20px; }
    .time-section { display: flex; flex-direction: column; gap: 8px; }
    
    .time-section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      color: var(--hint-color); letter-spacing: 0.05em;
      margin-left: 8px;
    }
    
    .section-task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .task-item-wrapper {
      display: block;
      animation: slideIn 0.3s var(--ease-out) backwards;
    }
    .task-item-wrapper.no-slide { animation: none; }

    .task-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border-radius: var(--r-card);
      background: var(--card-bg);
      box-shadow: var(--shadow-soft);
      transition: transform 0.15s, background 0.2s;
      cursor: pointer;
    }
    .task-card:active { transform: scale(0.98); }

    /* Красный акцент для "следующей" задачи */
    .task-card--next {
      background: var(--accent-red);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(229, 45, 39, 0.3);
    }
    .task-card--next .task-time, .task-card--next .task-project { color: rgba(255,255,255,0.8); }
    .task-card--next .task-checkbox { border-color: #FFFFFF; }
    .task-card--next .task-checkbox.checked { background: #FFFFFF; }
    .task-card--next .task-checkbox.checked::after { color: var(--accent-red); }
    
    .task-card--done { opacity: 0.6; }
    .task-card--done .task-text { text-decoration: line-through; }

    /* Чекбокс - кружок */
    .task-checkbox {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2.5px solid var(--text-color); background: transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding: 0; flex-shrink: 0; transition: all 0.2s;
    }
    .task-checkbox.checked { background: var(--text-color); }
    .task-checkbox.checked::after { content: "✓"; color: var(--card-bg); font-size: 14px; font-weight: 800; }

    .task-content { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
    .task-text { font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
    .task-time { font-size: 13px; font-weight: 600; color: var(--hint-color); }

    .task-project { display: none; } /* Убираем лишний текст проекта, он и так в цвете карточки */
    .delete-btn { display: none; } 

    /* Индивидуальные цвета фонов для проектов (опционально) */
    .task-card--project-work { background: var(--accent-green); color: #111; }
    .task-card--project-work .task-time { color: rgba(0,0,0,0.6); }
    .task-card--project-work .task-checkbox { border-color: #111; }
    
    /* ═══ 8. Empty State ═══ */
    #empty-state, #projects-empty {
      text-align: center; padding: 40px 20px;
      color: var(--hint-color); font-size: 14px; font-weight: 600;
      display: none; flex-direction: column; align-items: center; gap: 12px;
      background: var(--card-bg); border-radius: var(--r-card);
      box-shadow: var(--shadow-soft);
    }
    #empty-state svg, #projects-empty svg { display: none; }

    /* ═══ 9. Нижняя навигация (Плавающая) ═══ */
    .tab-bar {
      position: fixed; bottom: 24px; left: 20px; right: 20px;
      background: var(--text-color); border-radius: var(--r-pill);
      display: flex; justify-content: space-around; z-index: 100;
      padding: 8px; box-shadow: var(--shadow-float);
      transition: transform 0.3s var(--ease-out);
    }
    .tab-bar.kb-hidden { transform: translateY(150%); }
    
    .tab-item {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px;
      background: none; border: none; color: var(--bg-color); opacity: 0.5;
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; border-radius: var(--r-pill); transition: all 0.2s;
    }
    .tab-item.active { opacity: 1; background: rgba(255,255,255,0.1); color: var(--bg-color); }
    .tab-item svg { width: 20px; height: 20px; stroke: currentColor; }

    /* ═══ 10. Модальные окна и Шторки ═══ */
    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      visibility: hidden; opacity: 0; z-index: 1000;
      transition: opacity 0.2s, visibility 0.2s;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet-overlay.active { visibility: visible; opacity: 1; }
    #cat-filter-overlay { z-index: 1050; }

    .sheet {
      background: var(--bg-color);
      width: 100%; max-width: 600px;
      transform: translateY(100%);
      transition: transform 0.3s var(--ease-out);
      overflow: hidden; display: flex; flex-direction: column;
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
    }
    .sheet-overlay.active .sheet { transform: translateY(0); }
    .sheet--tall { max-height: 90vh; padding-bottom: env(safe-area-inset-bottom); }
    .sheet--bottom-pad { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    .picker-sheet--safe { padding-bottom: env(safe-area-inset-bottom); }

    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px; border-bottom: 1px solid var(--secondary-bg-color); flex-shrink: 0;
    }
    .sheet-header button {
      background: none; border: none; font-family: inherit; font-size: 16px;
      font-weight: 600; cursor: pointer; color: var(--text-color); padding: 4px 0;
      min-width: 60px; text-align: left;
    }
    .sheet-header .strong { text-align: right; font-weight: 800; }
    .sheet-title {
      font-size: 16px; font-weight: 700; color: var(--text-color);
    }
    .sheet-header-spacer { min-width: 60px; }

    /* Список проектов */
    .cat-filter-list { padding: 8px 24px; overflow-y: auto; flex: 1; min-height: 0; }
    .cat-filter-item, .cat-filter-main {
      width: 100%; display: flex; align-items: center; gap: 16px;
      padding: 16px 0; background: none; border: none;
      border-bottom: 1px solid var(--secondary-bg-color);
      font-family: inherit; font-size: 18px; font-weight: 600;
      cursor: pointer; color: var(--text-color); text-align: left;
    }
    .cat-filter-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .cat-filter-label { flex: 1; }
    .cat-filter-item.active .cat-filter-label,
    .cat-filter-row.active .cat-filter-label { font-weight: 800; }
    .cat-filter-check { width: 20px; height: 20px; opacity: 0; color: var(--text-color); flex-shrink: 0; }
    .cat-filter-item.active .cat-filter-check,
    .cat-filter-row.active .cat-filter-check { opacity: 1; }

    .cat-filter-row { display: flex; align-items: center; border-bottom: 1px solid var(--secondary-bg-color); }
    .cat-filter-main { border-bottom: none; }
    .cat-filter-delete { padding: 16px; background: none; border: none; color: var(--hint-color); cursor: pointer; }
    .cat-filter-delete:active { color: var(--accent-red); }

    .project-new-wrap { padding: 24px; }
    .project-new-btn {
      width: 100%; padding: 16px; border-radius: var(--r-pill);
      border: none; background: var(--secondary-bg-color); color: var(--text-color);
      font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .project-new-btn:active { opacity: 0.7; }

    /* Поповер создания проекта */
    .project-popover-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      visibility: hidden; opacity: 0; z-index: 1100;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      transition: opacity 0.2s;
    }
    .project-popover-overlay.active { visibility: visible; opacity: 1; }
    .project-popover {
      background: var(--bg-color); border-radius: var(--r-card);
      width: 100%; max-width: 400px; padding: 24px;
      display: flex; flex-direction: column; gap: 20px;
      box-shadow: var(--shadow-float);
    }
    .project-popover-header { display: flex; align-items: center; justify-content: space-between; }
    .project-popover-title { font-size: 22px; font-weight: 800; }
    .project-popover-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-color); }
    .project-popover-input, .edit-input {
      width: 100%; padding: 16px; border-radius: var(--r-chip); border: none;
      background: var(--secondary-bg-color); color: var(--text-color);
      font-family: inherit; font-size: 18px; font-weight: 600; outline: none;
    }
    .project-popover-input:focus, .edit-input:focus { box-shadow: 0 0 0 2px var(--text-color); }
    
    .project-palette { display: flex; gap: 12px; flex-wrap: wrap; }
    .project-color-dot {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid transparent; cursor: pointer; padding: 0;
    }
    .project-color-dot.selected { border-color: var(--text-color); }
    
    .project-popover-actions { display: flex; gap: 12px; margin-top: 8px; }
    .btn-accent, .btn-ghost {
      flex: 1; padding: 16px; border-radius: var(--r-pill); border: none;
      font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn-accent { background: var(--text-color); color: var(--bg-color); }
    .btn-ghost { background: var(--secondary-bg-color); color: var(--text-color); }

    /* ═══ 11. Проекты (Экран) ═══ */
    #projects-list { display: flex; flex-direction: column; gap: 16px; }
    .project-card {
      display: flex; flex-direction: column; gap: 16px;
      padding: 24px; border-radius: var(--r-card); background: var(--card-bg);
      box-shadow: var(--shadow-soft); cursor: pointer; text-align: left; color: var(--text-color);
    }
    .project-card-header { display: flex; align-items: center; gap: 12px; }
    .project-card-dot { width: 16px; height: 16px; border-radius: 50%; }
    .project-card-name { font-size: 22px; font-weight: 800; flex: 1; letter-spacing: -0.02em; }
    .project-card-today { font-size: 13px; font-weight: 700; color: var(--accent-red); }
    .project-card-bar { height: 6px; background: var(--secondary-bg-color); border-radius: 3px; overflow: hidden; }
    .project-card-bar-fill { height: 100%; border-radius: 3px; }
    .project-card-stats { font-size: 13px; font-weight: 600; color: var(--hint-color); }
    
    .project-week { display: flex; gap: 6px; margin-top: 8px; }
    .project-week-day {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 0; border-radius: 12px; border: none; background: var(--bg-color); cursor: pointer;
    }
    .project-week-wd { font-size: 10px; font-weight: 700; color: var(--hint-color); }
    .project-week-num { font-size: 16px; font-weight: 700; }
    .project-week-day.pw-today { background: var(--text-color); color: var(--bg-color); }
    .project-week-day.pw-today .project-week-wd { color: var(--bg-color); opacity: 0.6; }
    .project-week-indicator { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
    .project-week-day.pw-has-pending .project-week-indicator { background: var(--accent-red); }
    .project-week-day.pw-today.pw-has-pending .project-week-indicator { background: var(--bg-color); }

    /* ═══ 12. Разное ═══ */
    #progress {
      font-size: 14px; font-weight: 700; color: var(--hint-color); margin-bottom: 16px; text-align: center;
    }
    .mini-timeline { display: none; } /* Убираем мини-таймлайн для чистоты */
    
    .undo-toast {
      position: fixed; left: 20px; right: 20px; bottom: 100px;
      max-width: 500px; margin: 0 auto; background: var(--text-color); color: var(--bg-color);
      border-radius: var(--r-card); padding: 16px; display: flex; align-items: center; justify-content: space-between;
      transform: translateY(120%); opacity: 0; transition: transform 0.3s, opacity 0.3s; z-index: 200;
      box-shadow: var(--shadow-float);
    }
    .undo-toast.visible { transform: translateY(0); opacity: 1; }
    .undo-toast-text { font-size: 14px; font-weight: 600; }
    .undo-toast-btn { background: none; border: none; color: var(--accent-red); font-weight: 800; font-size: 14px; cursor: pointer; }

    .edit-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .edit-row { display: flex; gap: 12px; align-items: center; }

    /* ═══ 13. Экран приветствия ═══ */
    .welcome-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 3000; overflow: hidden; }
    .welcome-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .welcome-check { position: absolute; font-size: 42px; font-weight: 800; color: var(--accent-red); transform: translate(-50%, -50%) scale(0); }
    .welcome-check.pop { animation: welcomeCheckPop 0.5s var(--ease-out) forwards; }
    .welcome-inner { position: absolute; left: 0; right: 0; top: 45vh; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: 0 24px; }
    .welcome-greeting { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; text-align: center; opacity: 0; transform: translateY(10px); transition: all 0.4s; }

  <script>
    // ════ JS без изменений (весь функционал сохранён) ════
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.colorScheme) document.body.setAttribute('data-theme', tg.colorScheme);

    const PALETTE = ['#E52D27','#A3B899','#DFD870','#BC9A7E','#7B9EBE','#FF9F0A','#AF52DE','#FF2D55'];
    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const WEEKDAYS_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const TL_START_H = 5;
    const TL_END_H = 24;
    const TL_RANGE_MIN = (TL_END_H - TL_START_H) * 60;
    const UNDO_DURATION = 4000;
    const UI_STATE_KEY = 'logit_ui_state';
    const WELCOME_DONE_KEY = 'logit_welcome_done';
    const CLOUD_TIMEOUT_MS = 3000;

    const PARTICLE_GLOW_ALPHA = 0.28;
    const PARTICLE_CORE_ALPHA = 0.48;
    const PARTICLE_MAX = 2200;
    const PARTICLE_STEP = 3;
    const PARTICLE_ASSEMBLE_MS = 1400;
    const PARTICLE_MAX_DELAY_MS = 250;
    const PARTICLE_GLOW_SIZE_FACTOR = 6;

    function dateToISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function todayISO() { return dateToISO(new Date()); }
    function isoToDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function withTimeout(promise, ms) {
      return new Promise((resolve, reject) => {
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; reject(new Error('timeout')); } }, ms);
        promise.then(
          (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } },
          (e) => { if (!done) { done = true; clearTimeout(timer); reject(e); } }
        );
      });
    }

    class TaskStore {
      constructor() {
        this.tasks = [];
        this.projects = [];
        this.STORAGE_KEY = 'my_tasks_v3';
        this.FALLBACK_KEY = 'my_tasks_local_v3';
        this.OLD_STORAGE_KEY = 'my_tasks_v2';
        this.OLD_FALLBACK_KEY = 'my_tasks_local_v2';
        this.V1_STORAGE_KEY = 'my_tasks_v1';
        this.V1_FALLBACK_KEY = 'my_tasks_local_v1';
        this._initPromise = null;
        this.ready = false;
      }
      _defaults() {
        return [
          { id: 'personal', name: 'Личное', color: '#A3B899' },
          { id: 'work', name: 'Работа', color: '#E52D27' }
        ];
      }
      _id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
      _hasCloud() { return tg.CloudStorage && typeof tg.CloudStorage.getItem === 'function'; }
      async _cloudGet(key) {
        if (!this._hasCloud()) return null;
        try { return (await withTimeout(tg.CloudStorage.getItem(key), CLOUD_TIMEOUT_MS)) || null; }
        catch (e) { console.warn('cloudGet failed:', key, e && e.message); return null; }
      }
      _cloudSet(key, value) {
        if (!this._hasCloud()) return;
        withTimeout(tg.CloudStorage.setItem(key, value), CLOUD_TIMEOUT_MS)
          .catch((e) => console.warn('cloudSet failed:', key, e && e.message));
      }
      init() {
        if (!this._initPromise) {
          this._initPromise = this._load().catch((e) => {
            console.error('init failed:', e);
            this.tasks = [];
            this.projects = this._defaults();
            this.ready = true;
          });
        }
        return this._initPromise;
      }
      async _load() {
        let loaded = false;
        try {
          const saved = localStorage.getItem(this.FALLBACK_KEY);
          if (saved) {
            const data = JSON.parse(saved);
            if (data && typeof data === 'object' && !Array.isArray(data)) {
              this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
              this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
              loaded = true;
            }
          }
        } catch (e) { console.warn('local v3 load failed:', e && e.message); }
        if (!loaded) {
          try {
            const saved = await this._cloudGet(this.STORAGE_KEY);
            if (saved) {
              const data = JSON.parse(saved);
              if (data && typeof data === 'object' && !Array.isArray(data)) {
                this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
                this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
                loaded = true;
              }
            }
          } catch (e) { console.warn('cloud v3 load failed:', e && e.message); }
        }
        if (!loaded) {
          try {
            const saved = localStorage.getItem(this.OLD_FALLBACK_KEY);
            if (saved) {
              const data = JSON.parse(saved);
              if (data && typeof data === 'object' && !Array.isArray(data)) {
                this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
                this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
                loaded = true;
              }
            }
          } catch (e) {}
        }
        if (!loaded) {
          try {
            const saved = await this._cloudGet(this.OLD_STORAGE_KEY);
            if (saved) {
              const data = JSON.parse(saved);
              if (data && typeof data === 'object' && !Array.isArray(data)) {
                this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
                this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
                loaded = true;
              }
            }
          } catch (e) {}
        }
        if (!loaded) {
          let oldTasks = null;
          try {
            const saved = localStorage.getItem(this.V1_FALLBACK_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed)) oldTasks = parsed;
            }
          } catch (e) {}
          if (!oldTasks) {
            try {
              const saved = await this._cloudGet(this.V1_STORAGE_KEY);
              if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) oldTasks = parsed;
              }
            } catch (e) {}
          }
          this.tasks = oldTasks || [];
          this.projects = this._defaults();
        }
        this._migrate();
        this.save();
        this.ready = true;
      }
      _migrate() {
        try {
          if (!this.projects || this.projects.length === 0) this.projects = this._defaults();
          this.tasks = this.tasks.map(t => {
            const updated = { ...t };
            if (!updated.id) updated.id = this._id();
            if (!updated.date) updated.date = todayISO();
            if (updated.time === undefined || updated.time === null) updated.time = '';
            if (!updated.projectId) {
              if (updated.category === 'work') updated.projectId = 'work';
              else updated.projectId = 'personal';
              if (updated.category !== undefined) delete updated.category;
            }
            if (!this.projects.find(p => p.id === updated.projectId)) {
              updated.projectId = this.projects[0].id;
            }
            return updated;
          });
        } catch (e) { console.error('migrate failed:', e); }
      }
      save() {
        try {
          const data = { tasks: this.tasks, projects: this.projects };
          const json = JSON.stringify(data);
          try { localStorage.setItem(this.FALLBACK_KEY, json); }
          catch (e) { console.error('localStorage save failed:', e); }
          this._cloudSet(this.STORAGE_KEY, json);
        } catch (e) { console.error('save failed:', e); }
      }
      getProject(id) {
        return this.projects.find(p => p.id === id) || this.projects[0] || { id: 'personal', name: 'Личное', color: '#A3B899' };
      }
      getProjectColor(id) { return this.getProject(id).color; }
      addTask(data) {
        const task = { id: this._id(), text: data.text, done: false, date: data.date, time: data.time || '', projectId: data.projectId };
        this.tasks.push(task);
        return task;
      }
      deleteTask(index) {
        if (index < 0 || index >= this.tasks.length) return null;
        return this.tasks.splice(index, 1)[0];
      }
      restoreTask(task, index) {
        if (!task) return;
        const at = Math.max(0, Math.min(index, this.tasks.length));
        this.tasks.splice(at, 0, task);
      }
      toggleTask(index) {
        if (index < 0 || index >= this.tasks.length) return null;
        this.tasks[index].done = !this.tasks[index].done;
        return this.tasks[index];
      }
      updateTask(index, updates) {
        if (index < 0 || index >= this.tasks.length) return null;
        Object.assign(this.tasks[index], updates);
        return this.tasks[index];
      }
      addProject(name, color) {
        const project = { id: 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, color };
        this.projects.push(project);
        return project;
      }
      deleteProject(id) {
        if (this.projects.length <= 1) return null;
        const project = this.projects.find(p => p.id === id);
        if (!project) return null;
        const fallback = this.projects.find(p => p.id !== id);
        if (!fallback) return null;
        this.tasks.forEach(t => { if (t.projectId === id) t.projectId = fallback.id; });
        this.projects = this.projects.filter(p => p.id !== id);
        return project;
      }
      filterTasks(date, filter) {
        return this.tasks.filter(t => t.date === date && (filter === 'all' || t.projectId === filter));
      }
    }

    const store = new TaskStore();
    let selectedDate = todayISO();
    let calendarDays = [];
    let suppressScrollSelect = false;
    let currentView = 'tasks';
    let currentFilter = 'all';
    let addProjectId = 'personal';
    let editProjectId = 'personal';
    let projectSheetMode = 'filter';
    let pendingProjectColor = PALETTE[0];
    let pickerMonth = new Date().getMonth();
    let pickerYearValue = new Date().getFullYear();
    let editingIndex = -1;
    let justCheckedIndex = -1;
    let staggerNextRender = false;
    let skipSlideIn = false;
    let pendingUndo = null;

    function pluralForm(n, one, few, many) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 14) return many;
      if (mod10 === 1) return one;
      if (mod10 >= 2 && mod10 <= 4) return few;
      return many;
    }
    function formatDateLabel(iso) {
      const d = isoToDate(iso);
      const today = new Date(); today.setHours(0,0,0,0);
      const diffDays = Math.round((d - today) / 86400000);
      let prefix;
      if (diffDays === 0) prefix = 'Сегодня';
      else if (diffDays === 1) prefix = 'Завтра';
      else if (diffDays === -1) prefix = 'Вчера';
      else { prefix = WEEKDAYS_FULL[d.getDay()]; prefix = prefix.charAt(0).toUpperCase() + prefix.slice(1); }
      return `${prefix}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
    }
    function formatMonthYear(iso) {
      const d = isoToDate(iso);
      return MONTHS[d.getMonth()].toUpperCase() + ' ' + d.getFullYear();
    }
    function isOverdue(task) {
      if (task.done || !task.time) return false;
      const d = isoToDate(task.date);
      const [h, m] = task.time.split(':').map(Number);
      d.setHours(h, m, 0, 0);
      return d < new Date();
    }
    function matchesCategory(task) {
      return currentFilter === 'all' || task.projectId === currentFilter;
    }
    function timeToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }
    function minutesToPct(min) {
      return Math.max(0, Math.min(100, (min - TL_START_H * 60) / TL_RANGE_MIN * 100));
    }
    function getTimeGreeting() {
      const h = new Date().getHours();
      if (h >= 5 && h < 12) return 'Доброе утро';
      if (h >= 12 && h < 17) return 'Добрый день';
      if (h >= 17 && h < 23) return 'Добрый вечер';
      return 'Доброй ночи';
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function buildDaySummaryLine() {
      const now = new Date();
      const hours = now.getHours();
      const isLateNight = hours >= 23;

      if (isLateNight) {
        const t = new Date(now);
        t.setDate(t.getDate() + 1);
        const targetISO = dateToISO(t);
        const tasks = store.tasks.filter(x => x.date === targetISO);
        if (tasks.length === 0) return 'Завтра свободно — можно отдохнуть';

        const total = tasks.length;
        const word = pluralForm(total, 'задача', 'задачи', 'задач');
        const withTime = tasks
          .filter(x => x.time)
          .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

        if (withTime.length > 0) {
          return 'Завтра ' + total + ' ' + word + ' · первая в ' + withTime[0].time;
        }
        return 'Завтра ' + total + ' ' + word;
      }

      const today = todayISO();
      const tasks = store.tasks.filter(x => x.date === today);
      if (tasks.length === 0) return 'Сегодня свободно — добавь первую';

      const total = tasks.length;
      const done = tasks.filter(x => x.done).length;
      if (done === total) return 'Все задачи на сегодня готовы 🎉';

      const nowMin = now.getHours() * 60 + now.getMinutes();
      const upcoming = tasks
        .filter(x => !x.done && x.time && timeToMinutes(x.time) > nowMin)
        .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

      if (upcoming.length > 0) {
        const remaining = total - done;
        const word = pluralForm(remaining, 'задача', 'задачи', 'задач');
        return 'Сегодня ' + remaining + ' ' + word + ' · ближайшая в ' + upcoming[0].time;
      }

      if (done > 0) return 'Сделано ' + done + ' из ' + total + ' — продолжай';

      return 'Сегодня ' + total + ' ' + pluralForm(total, 'задача', 'задачи', 'задач');
    }

    (function setupKeyboardHandling() {
      const tabBar = document.getElementById('tab-bar');
      if (!tabBar) return;
      function setKeyboardOpen(isOpen) {
        tabBar.classList.toggle('kb-hidden', isOpen);
        document.body.classList.toggle('kb-open', isOpen);
      }
      function isInputFocused() {
        const el = document.activeElement;
        if (!el) return false;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
      }
      document.addEventListener('focusin', (e) => {
        const el = e.target;
        if (!el) return;
        const tag = el.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) setKeyboardOpen(true);
      });
      document.addEventListener('focusout', () => {
        setTimeout(() => { if (!isInputFocused()) setKeyboardOpen(false); }, 120);
      });
      if (window.visualViewport) {
        const vv = window.visualViewport;
        let stableHeight = window.innerHeight;
        window.addEventListener('resize', () => {
          if (Math.abs(window.innerHeight - vv.height) < 100) stableHeight = window.innerHeight;
        });
        const onVpChange = () => {
          const isKb = (stableHeight - vv.height) > 150;
          if (isKb && isInputFocused()) setKeyboardOpen(true);
          else if (!isKb && !isInputFocused()) setKeyboardOpen(false);
        };
        vv.addEventListener('resize', onVpChange);
        vv.addEventListener('scroll', onVpChange);
      }
    })();

    function runParticleAnimation(canvas) {
      return new Promise((resolve) => {
        try {
          const ctx = canvas.getContext('2d');
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const accent = getComputedStyle(document.documentElement).getPropertyValue('--button-color').trim() || '#111111';
          const glowSize = 64;
          const glowSprite = document.createElement('canvas');
          glowSprite.width = glowSize; glowSprite.height = glowSize;
          const gctx = glowSprite.getContext('2d');
          const grd = gctx.createRadialGradient(glowSize/2, glowSize/2, 0, glowSize/2, glowSize/2, glowSize/2);
          grd.addColorStop(0, accent);
          grd.addColorStop(0.18, accent);
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          gctx.fillStyle = grd;
          gctx.fillRect(0, 0, glowSize, glowSize);

          const off = document.createElement('canvas');
          off.width = w; off.height = h;
          const octx = off.getContext('2d');
          const fontSize = Math.min(w * 0.16, 64);
          octx.fillStyle = '#fff';
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          octx.font = `800 ${fontSize}px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif`;

          const word = 'LOGIT';
          const letterSpacing = fontSize * 0.15;
          const letterWidths = [];
          let totalW = 0;
          for (let i = 0; i < word.length; i++) {
            const lw = octx.measureText(word[i]).width;
            letterWidths.push(lw);
            totalW += lw + (i < word.length - 1 ? letterSpacing : 0);
          }
          let cx = w / 2 - totalW / 2;
          const cy = h * 0.28;
          for (let i = 0; i < word.length; i++) {
            octx.fillText(word[i], cx + letterWidths[i] / 2, cy);
            cx += letterWidths[i] + letterSpacing;
          }

          const data = octx.getImageData(0, 0, w, h).data;
          const targets = [];
          for (let y = 0; y < h; y += PARTICLE_STEP) {
            for (let x = 0; x < w; x += PARTICLE_STEP) {
              if (data[(y * w + x) * 4 + 3] > 128) targets.push({ x, y });
            }
          }
          let sampled = targets;
          if (targets.length > PARTICLE_MAX) {
            sampled = [];
            const stride = targets.length / PARTICLE_MAX;
            for (let i = 0; i < PARTICLE_MAX; i++) sampled.push(targets[Math.floor(i * stride)]);
          }

          const maxDelay = PARTICLE_MAX_DELAY_MS;
          const moveWindow = PARTICLE_ASSEMBLE_MS - maxDelay;
          const particles = sampled.map(t => {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.max(w, h) * (0.5 + Math.random() * 0.6);
            return {
              startX: w / 2 + Math.cos(angle) * radius,
              startY: h / 2 + Math.sin(angle) * radius,
              tx: t.x, ty: t.y, x: 0, y: 0,
              size: 1.2 + Math.random() * 1.3,
              delay: Math.random() * maxDelay
            };
          });

          const phaseStart = performance.now();
          function loop(now) {
            const elapsed = now - phaseStart;
            ctx.clearRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = accent;
            let allSettled = true;
            for (let i = 0; i < particles.length; i++) {
              const p = particles[i];
              const localT = Math.min(Math.max((elapsed - p.delay) / moveWindow, 0), 1);
              const ease = 1 - Math.pow(1 - localT, 3);
              p.x = p.startX + (p.tx - p.startX) * ease;
              p.y = p.startY + (p.ty - p.startY) * ease;
              if (localT < 1) allSettled = false;
              const drawSize = Math.max(10, p.size * PARTICLE_GLOW_SIZE_FACTOR);
              ctx.globalAlpha = PARTICLE_GLOW_ALPHA;
              ctx.drawImage(glowSprite, p.x - drawSize / 2, p.y - drawSize / 2, drawSize, drawSize);
              ctx.globalAlpha = PARTICLE_CORE_ALPHA;
              ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
            if (allSettled) { resolve({ w, h, fontSize, cy }); return; }
            requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);
        } catch (e) {
          console.error('particle anim failed:', e);
          resolve({ w: window.innerWidth, h: window.innerHeight, fontSize: 48, cy: window.innerHeight * 0.28 });
        }
      });
    }

    async function playWelcome() {
      const screen = document.getElementById('welcome-screen');
      const canvas = document.getElementById('welcome-canvas');
      const check = document.getElementById('welcome-check');
      const startBtn = document.getElementById('welcome-start');
      const greeting = document.getElementById('welcome-greeting');
      const subtitle = document.getElementById('welcome-subtitle');
      const isFirstVisit = !isWelcomeDone();

      try {
        startBtn.classList.remove('visible');
        greeting.textContent = '';
        subtitle.textContent = '';
        greeting.classList.remove('shown');
        subtitle.classList.remove('shown');
        check.classList.remove('pop');
        check.style.left = '';
        check.style.top = '';
        screen.classList.remove('closing');
        screen.style.display = 'block';

        document.body.classList.add('welcome-open');
        document.body.classList.remove('booting');

        const userName = (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'друг';
        await sleep(80);

        const layout = await runParticleAnimation(canvas);
        await sleep(60);
        showCheckmark(layout);
        await sleep(isFirstVisit ? 280 : 200);

        greeting.textContent = getTimeGreeting() + ', ' + userName + '!';
        greeting.classList.add('shown');
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}

        if (isFirstVisit) {
          await sleep(400);
          subtitle.textContent = 'Твой день начинается здесь';
          subtitle.classList.add('shown');
          await sleep(350);
        } else {
          try { await store.init(); } catch (e) {}
          await sleep(220);
          subtitle.textContent = buildDaySummaryLine();
          subtitle.classList.add('shown');
          await sleep(220);
        }

        startBtn.classList.add('visible');
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      } catch (e) {
        console.error('playWelcome failed:', e);
        document.body.classList.remove('booting');
        document.body.classList.remove('welcome-open');
        if (screen) screen.style.display = 'none';
        try { startBtn.classList.add('visible'); } catch (e2) {}
      }
    }

    function createNewProject() {
      try {
        const input = document.getElementById('project-popover-input');
        if (!input) return;
        const name = input.value.trim();
        if (!name) { try { input.focus(); } catch (e) {} return; }

        store.save();
        input.value = '';
        pendingProjectColor = PALETTE[0];
        closeNewProjectPopover();

          addProjectId = newProject.id;

          try { renderProjectsView(); } catch (e) { console.error(e); }

      } catch (e) { console.error('createNewProject failed:', e); }
    }

    function handleDeleteProject(id) {
      try {
        if (store.projects.length <= 1) return;
        const project = store.projects.find(p => p.id === id);
        if (!project) return;
        const performDelete = () => {
          try {
            const removed = store.deleteProject(id);
            if (!removed) return;
            if (currentFilter === id) currentFilter = 'all';
            if (addProjectId === id) addProjectId = store.projects[0].id;
            if (editProjectId === id) editProjectId = store.projects[0].id;
            store.save();
            saveState();
            updateProjectPillUI();
            updateProjectToggleUI();
            updateEditProjectToggleUI();
            renderProjectSheet();
            updateCalendarDots();
            render();
            if (currentView === 'projects') renderProjectsView();
            try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
          } catch (e) { console.error('performDelete failed:', e); }
        };
        const message = 'Удалить проект «' + project.name + '»? Задачи перейдут в другой проект.';
        if (tg.showConfirm && typeof tg.showConfirm === 'function') {
          try { tg.showConfirm(message, (ok) => { if (ok) performDelete(); }); return; } catch (e) {}
        }
        if (window.confirm && window.confirm(message)) performDelete();
      } catch (e) { console.error('handleDeleteProject failed:', e); }
    }

    function buildProjectWeekStrip(project) {
      const todayDate = isoToDate(todayISO());
      const weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
      const weekEl = document.createElement('div');
      weekEl.className = 'project-week';

      for (let i = 0; i < 7; i++) {
        const d = new Date(todayDate);
        d.setDate(d.getDate() + i);
        const iso = dateToISO(d);
        let pending = 0, done = 0;
        for (const t of store.tasks) {
          if (t.date === iso && t.projectId === project.id) {
            if (t.done) done++;
            else pending++;
          }
        }
        const dow = d.getDay();

        const dayBtn = document.createElement('button');
        dayBtn.type = 'button';
        dayBtn.className = 'project-week-day';
        dayBtn.dataset.date = iso;
        if (i === 0) dayBtn.classList.add('pw-today');
        if (dow === 0 || dow === 6) dayBtn.classList.add('pw-weekend');
        if (pending > 0) dayBtn.classList.add('pw-has-pending');
        else if (done > 0) dayBtn.classList.add('pw-has-done');
        else dayBtn.classList.add('pw-empty');

        dayBtn.innerHTML = `
          <span class="project-week-wd">${weekdays[dow]}</span>
          <span class="project-week-num">${d.getDate()}</span>
          <span class="project-week-indicator"></span>
        `;

        dayBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedDate = iso;
          currentFilter = project.id;
          addProjectId = project.id;
          saveState();
          buildCalendar();
          updateProjectPillUI();
          updateProjectToggleUI();
          staggerNextRender = true;
          render();
          switchView('tasks');
          try { tg.HapticFeedback.selectionChanged(); } catch (err) {}
        });

        weekEl.appendChild(dayBtn);
      }

      return weekEl;
    }

    function renderProjectsView() {
      try {
        const listEl = document.getElementById('projects-list');
        const emptyEl = document.getElementById('projects-empty');
        if (!listEl) return;
        listEl.innerHTML = '';

        if (!store.projects || store.projects.length === 0) {
          if (emptyEl) emptyEl.style.display = 'flex';
          return;
        }
        if (emptyEl) emptyEl.style.display = 'none';

        const today = todayISO();
        const rows = store.projects.map(p => {
          const allTasks = store.tasks.filter(t => t.projectId === p.id);
          const total = allTasks.length;
          const done = allTasks.filter(t => t.done).length;
          const todayTasks = allTasks.filter(t => t.date === today);
          const todayTotal = todayTasks.length;
          const todayDone = todayTasks.filter(t => t.done).length;
          return { project: p, total, done, todayTotal, todayDone };
        });

        rows.sort((a, b) => {
          if (b.todayTotal !== a.todayTotal) return b.todayTotal - a.todayTotal;
          return b.total - a.total;
        });

        const fragment = document.createDocumentFragment();
        rows.forEach(({ project, total, done, todayTotal, todayDone }) => {
          const percent = total > 0 ? Math.round((done / total) * 100) : 0;
          const card = document.createElement('div');
          card.className = 'project-card';
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.style.setProperty('--project-color', project.color);
          card.dataset.projectId = project.id;
          const statsText = total === 0
            ? 'НЕТ ЗАДАЧ'
            : done + ' ИЗ ' + total + ' · ' + percent + '%';
          const todayBadge = todayTotal > 0
            ? `<span class="project-card-today">${todayDone}/${todayTotal} СЕГОДНЯ</span>`
            : '';
          card.innerHTML = `
            <div class="project-card-header">
              <span class="project-card-dot" style="background: ${project.color};"></span>
              <span class="project-card-name">${escapeHtml(project.name)}</span>
              ${todayBadge}
            </div>
            <div class="project-card-bar">
              <div class="project-card-bar-fill" style="width: ${percent}%; background: ${project.color};"></div>
            </div>
            <div class="project-card-stats">${statsText}</div>
          `;

          card.appendChild(buildProjectWeekStrip(project));

          const handleCardClick = () => {
            currentFilter = project.id;
            addProjectId = project.id;
            saveState();
            updateProjectPillUI();
            updateProjectToggleUI();
            updateCalendarDots();
            render();
            if (currentView !== 'tasks') switchView('tasks');
            try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
          };
          card.addEventListener('click', handleCardClick);
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              handleCardClick();
            }
          });

          fragment.appendChild(card);
        });
        listEl.appendChild(fragment);

    function buildCalendar() {
      try {
        const base = isoToDate(selectedDate);
        base.setHours(0,0,0,0);
        const days = [];
        for (let i = -180; i <= 180; i++) {
          const d = new Date(base);
          d.setDate(d.getDate() + i);
          days.push(dateToISO(d));
        }
        calendarDays = days;
        renderCalendar();
      } catch (e) { console.error('buildCalendar failed:', e); }
    }
    function renderCalendar() {
      try {
        const strip = document.getElementById('calendar-strip');
        strip.innerHTML = '';
        const todayStr = todayISO();
        const weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        calendarDays.forEach(iso => {
          const d = isoToDate(iso);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'day-cell';
          if (iso === selectedDate) btn.classList.add('selected');
          if (iso === todayStr) btn.classList.add('today');
          const dow = d.getDay();
          if (dow === 0 || dow === 6) btn.classList.add('weekend');
          btn.dataset.date = iso;
          btn.innerHTML = `
            <span class="weekday">${weekdays[dow]}</span>
            <span class="date-num">${d.getDate()}</span>
            <span class="day-dot"></span>
          `;
          btn.addEventListener('click', () => selectDate(iso, true));
          strip.appendChild(btn);
        });
        requestAnimationFrame(() => scrollToSelected(false));
        attachScrollHandler();
        updateCalendarDots();
        setTimeout(updateCalendarFade, 150);
      } catch (e) { console.error('renderCalendar failed:', e); }
    }
    function updateCalendarDots() {
      try {
        document.querySelectorAll('.day-cell').forEach(cell => {
          const iso = cell.dataset.date;
          const hasPending = store.tasks.some(t => t.date === iso && !t.done && matchesCategory(t));
          cell.classList.toggle('has-tasks', hasPending);
        });
      } catch (e) {}
    }
    function attachScrollHandler() {
      try {
        const strip = document.getElementById('calendar-strip');
        if (!strip || strip.dataset.hasScrollHandler) return;
        strip.dataset.hasScrollHandler = '1';
        let timer;
        strip.addEventListener('scroll', () => {
          updateCalendarFade();
          if (suppressScrollSelect) return;
          clearTimeout(timer);
          timer = setTimeout(() => {
            const center = strip.scrollLeft + strip.clientWidth / 2;
            let closest = null, minDist = Infinity;
            strip.querySelectorAll('.day-cell').forEach(cell => {
              const cc = cell.offsetLeft + cell.offsetWidth / 2;
              const dist = Math.abs(cc - center);
              if (dist < minDist) { minDist = dist; closest = cell; }
            });
            if (closest && closest.dataset.date !== selectedDate) {
              selectDate(closest.dataset.date, false);
            }
          }, 120);
        }, { passive: true });
      } catch (e) {}
    }
    function updateCalendarFade() {
      try {
        const wrap = document.getElementById('calendar-strip-wrap');
        const strip = document.getElementById('calendar-strip');
        if (!wrap || !strip) return;
        const cells = strip.querySelectorAll('.day-cell');
        if (cells.length === 0) return;
        const stripRect = strip.getBoundingClientRect();
        const firstRect = cells[0].getBoundingClientRect();
        const lastRect = cells[cells.length - 1].getBoundingClientRect();
        wrap.classList.toggle('has-more-left', firstRect.left < stripRect.left - 8);
        wrap.classList.toggle('has-more-right', lastRect.right > stripRect.right + 8);
      } catch (e) {}
    }
    function scrollCalendarBy(dir) {
      try {
        const strip = document.getElementById('calendar-strip');
        if (!strip) return;
        strip.scrollBy({ left: dir * strip.clientWidth * 0.7, behavior: 'smooth' });
        try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
      } catch (e) {}
    }
    function scrollToSelected(smooth) {
      try {
        const strip = document.getElementById('calendar-strip');
        const sel = strip.querySelector('.selected');
        if (!sel) return;
        suppressScrollSelect = true;
        const target = sel.offsetLeft - strip.clientWidth / 2 + sel.clientWidth / 2;
        strip.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
        setTimeout(() => {
          suppressScrollSelect = false;
          updateCalendarFade();
        }, smooth ? 500 : 100);
      } catch (e) {}
    }
    function selectDate(iso, scroll) {
      if (iso === selectedDate) { if (scroll) scrollToSelected(true); return; }
      selectedDate = iso;
      saveState();
      document.querySelectorAll('.day-cell').forEach(cell => {
        cell.classList.toggle('selected', cell.dataset.date === iso);
      });
      staggerNextRender = true;
      render();
      if (scroll) scrollToSelected(true);
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }

    function buildWheels() {
      try {
        const currentYear = new Date().getFullYear();
        const mw = document.querySelector('#wheel-month .wheel-inner');
        mw.innerHTML = '';
        MONTHS.forEach((name, i) => {
          const el = document.createElement('div');
          el.className = 'wheel-item';
          el.dataset.value = i;
          el.textContent = name;
          mw.appendChild(el);
        });
        const yw = document.querySelector('#wheel-year .wheel-inner');
        yw.innerHTML = '';
        for (let y = currentYear - 10; y <= currentYear + 10; y++) {
          const el = document.createElement('div');
          el.className = 'wheel-item';
          el.dataset.value = y;
          el.textContent = y;
          yw.appendChild(el);
        }
        attachWheelScroll('wheel-month');
        attachWheelScroll('wheel-year');
      } catch (e) { console.error('buildWheels failed:', e); }
    }
    function getWheelValue(wheelId) {
      const wheel = document.getElementById(wheelId);
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closest = null, minDist = Infinity;
      wheel.querySelectorAll('.wheel-item').forEach(item => {
        const ic = item.offsetTop + item.offsetHeight / 2;
        const dist = Math.abs(ic - center);
        if (dist < minDist) { minDist = dist; closest = item; }
      });
      return closest ? parseInt(closest.dataset.value, 10) : null;
    }
    function updateWheelVisual(wheelId) {
      const wheel = document.getElementById(wheelId);
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closest = null, minDist = Infinity;
      wheel.querySelectorAll('.wheel-item').forEach(item => {
        const ic = item.offsetTop + item.offsetHeight / 2;
        const dist = Math.abs(ic - center);
        if (dist < minDist) { minDist = dist; closest = item; }
      });
      wheel.querySelectorAll('.wheel-item').forEach(el => el.classList.remove('active'));
      if (closest) closest.classList.add('active');
    }
    function scrollWheelTo(wheelId, value) {
      const wheel = document.getElementById(wheelId);
      const item = wheel.querySelector(`.wheel-item[data-value="${value}"]`);
      if (!item) return;
      wheel.scrollTop = item.offsetTop - wheel.clientHeight / 2 + item.offsetHeight / 2;
      updateWheelVisual(wheelId);
    }
    function attachWheelScroll(wheelId) {
      const wheel = document.getElementById(wheelId);
      let hapticTimer;
      let lastValue = getWheelValue(wheelId);
      const update = () => {
        updateWheelVisual(wheelId);
        const v = getWheelValue(wheelId);
        if (v !== null && v !== lastValue) {
          lastValue = v;
          clearTimeout(hapticTimer);
          hapticTimer = setTimeout(() => {
            try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
          }, 80);
        }
      };
      wheel.addEventListener('scroll', update, { passive: true });
      wheel.addEventListener('touchend', () => setTimeout(update, 50), { passive: true });
    }
    function openPicker() {
      const d = isoToDate(selectedDate);
      pickerMonth = d.getMonth();
      pickerYearValue = d.getFullYear();
      document.getElementById('picker-overlay').classList.add('active');
      document.body.classList.add('picker-open');
      setTimeout(() => {
        scrollWheelTo('wheel-month', pickerMonth);
        scrollWheelTo('wheel-year', pickerYearValue);
      }, 80);
    }
    function closePicker() {
      document.getElementById('picker-overlay').classList.remove('active');
      document.body.classList.remove('picker-open');
    }
    function applyPicker() {
      const m = getWheelValue('wheel-month');
      const y = getWheelValue('wheel-year');
      if (m !== null) pickerMonth = m;
      if (y !== null) pickerYearValue = y;
      jumpToMonthYear(pickerMonth, pickerYearValue);
      closePicker();
    }
    function jumpToMonthYear(monthIndex, year) {
      const current = isoToDate(selectedDate);
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      const day = Math.min(current.getDate(), lastDay);
      selectedDate = dateToISO(new Date(year, monthIndex, day));
      saveState();
      buildCalendar();
      staggerNextRender = true;
      render();
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    }

    function attachLongPress(card, index) {
      let startX = 0, startY = 0, moved = false, timer = null;
      card.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        moved = false;
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (!moved) {
            openEditModal(index);
            try { tg.HapticFeedback.impactOccurred('medium'); } catch (err) {}
          }
        }, 500);
      }, { passive: true });
      card.addEventListener('touchmove', (e) => {
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 || dy > 8) { moved = true; clearTimeout(timer); }
      }, { passive: true });
      card.addEventListener('touchend', () => clearTimeout(timer));
      card.addEventListener('touchcancel', () => clearTimeout(timer));
    }

    function renderTimeline(dayTasks) {
      // Отключено для чистоты дизайна
    }
    function getNextUpcoming(dayTasks) {
      if (selectedDate !== todayISO()) return null;
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const upcoming = dayTasks
        .filter(t => !t.done && t.time && timeToMinutes(t.time) > nowMin)
        .map(t => ({ task: t, min: timeToMinutes(t.time) }))
        .sort((a, b) => a.min - b.min)[0];
      return upcoming ? upcoming.task : null;
    }
    function updateNowMarker() {}
    function scrollToTask(id) {}
    function updateDayFocus(dayTasks) {
      try {
        const progressEl = document.getElementById('progress');
        if (dayTasks.length === 0) { progressEl.textContent = ''; return; }
        const doneCount = dayTasks.filter(t => t.done).length;
        if (doneCount === dayTasks.length) { progressEl.textContent = 'ВСЕ ВЫПОЛНЕНЫ'; return; }
        const next = getNextUpcoming(dayTasks.filter(t => t.time));
        if (next) {
          const text = next.text.length > 20 ? next.text.slice(0, 20) + '…' : next.text;
          progressEl.textContent = `${doneCount}/${dayTasks.length} · ${text}`;
        } else {
          progressEl.textContent = `${doneCount}/${dayTasks.length}`;
        }
      } catch (e) {}
    }

    function buildTaskCard(task, isNext, position, doStagger) {
      const globalIndex = store.tasks.indexOf(task);
      const isJustChecked = justCheckedIndex === globalIndex;
      const wrapper = document.createElement('li');
      wrapper.className = 'task-item-wrapper';
      wrapper.id = 'task-card-' + globalIndex;
      
      const project = store.getProject(task.projectId);
      
      if (skipSlideIn) wrapper.classList.add('no-slide');
      else if (doStagger) wrapper.style.animationDelay = (Math.min(position, 8) * 35) + 'ms';
      
      const classes = [
        'task-card',
        task.done ? 'task-card--done' : '',
        isNext ? 'task-card--next' : ''
      ].filter(Boolean).join(' ');
      
      // Инлайн-стиль для фона проекта (если это не "next" задача)
      const style = !isNext && project.color ? `style="background: ${project.color}; color: ${getContrastColor(project.color)}"` : '';
      const timeColor = !isNext && project.color ? getContrastColor(project.color, 0.6) : '';

      wrapper.innerHTML = `
        <div class="${classes}" ${style}>
          <button type="button" class="task-checkbox${task.done ? ' checked' : ''}${isJustChecked ? ' just-checked' : ''}" aria-label="Готово" aria-checked="${task.done}"></button>
          <div class="task-content">
            <span class="task-text">${escapeHtml(task.text)}</span>
            <span class="task-time" ${timeColor ? `style="color: ${timeColor}"` : ''}>${task.time ? escapeHtml(task.time) : 'ВЕСЬ ДЕНЬ'}</span>
          </div>
        </div>
      `;
      
      const card = wrapper.querySelector('.task-card');
      const checkbox = wrapper.querySelector('.task-checkbox');
      
      checkbox.addEventListener('click', (e) => { e.stopPropagation(); toggleTask(globalIndex); });
      attachLongPress(card, globalIndex);
      return wrapper;
    }

    // Вспомогательная функция для контраста текста на цветном фоне
    function getContrastColor(hexColor, alpha = 1) {
      if (!hexColor || !hexColor.startsWith('#')) return alpha === 1 ? '#111' : 'rgba(0,0,0,0.6)';
      const r = parseInt(hexColor.slice(1, 3), 16);
      const g = parseInt(hexColor.slice(3, 5), 16);
      const b = parseInt(hexColor.slice(5, 7), 16);
      const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      const isDark = yiq < 128;
      
      if (alpha === 1) return isDark ? '#FFFFFF' : '#111111';
      return isDark ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha})`;
    }

    function renderTasksList(dayTasks, nextTask, doStagger) {
      const sectionsEl = document.getElementById('task-sections');
      const emptyState = document.getElementById('empty-state');
      sectionsEl.innerHTML = '';
      if (dayTasks.length === 0) {
        emptyState.style.display = 'flex';
        const p = emptyState.querySelector('p');
        if (p) {
          if (currentFilter === 'all') p.textContent = 'НЕТ ЗАДАЧ НА ЭТОТ ДЕНЬ';
          else p.textContent = 'НЕТ ЗАДАЧ В ЭТОМ ПРОЕКТЕ';
        }
        return;
      }
      emptyState.style.display = 'none';
      const sections = { morning: [], day: [], evening: [], notime: [] };
      dayTasks.forEach(t => {
        if (!t.time) { sections.notime.push(t); return; }
        const h = parseInt(t.time.split(':')[0], 10);
        if (h >= 5 && h < 12) sections.morning.push(t);
        else if (h >= 12 && h < 17) sections.day.push(t);
        else sections.evening.push(t);
      });
      ['morning','day','evening','notime'].forEach(k => {
        sections[k].sort((a, b) => {
          if (!a.time && !b.time) return 0;
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });
      });
      const cfg = [
        { key: 'morning', title: 'УТРО' },
        { key: 'day', title: 'ДЕНЬ' },
        { key: 'evening', title: 'ВЕЧЕР' },
        { key: 'notime', title: 'БЕЗ ВРЕМЕНИ' }
      ];
      let cardPosition = 0;
      cfg.forEach(c => {
        const items = sections[c.key];
        if (items.length === 0) return;
        const sectionEl = document.createElement('div');
        sectionEl.className = 'time-section';
        const titleEl = document.createElement('div');
        titleEl.className = 'time-section-title';
        titleEl.textContent = c.title;
        const listEl = document.createElement('ul');
        listEl.className = 'section-task-list';
        items.forEach(t => {
          const isNext = nextTask && t === nextTask;
          listEl.appendChild(buildTaskCard(t, isNext, cardPosition, doStagger));
          cardPosition++;
        });
        sectionEl.appendChild(titleEl);
        sectionEl.appendChild(listEl);
        sectionsEl.appendChild(sectionEl);
      });
    }

    function addTask() {
      try {
        const input = document.getElementById('task-input');
        const timeInput = document.getElementById('task-time');
        const text = input.value.trim();
        if (!text) return;
        store.addTask({ text, date: selectedDate, time: timeInput.value || '', projectId: addProjectId });
        store.save();
        input.value = '';
        timeInput.value = '';
        updateTimeBtn();
        if (currentFilter !== 'all' && currentFilter !== addProjectId) {
          currentFilter = addProjectId;
          saveState();
          updateProjectPillUI();
        }
        render();
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
        input.blur();
      } catch (e) { console.error('addTask failed:', e); }
    }
    function toggleTask(index) {
      try {
        store.toggleTask(index);
        justCheckedIndex = store.tasks[index] && store.tasks[index].done ? index : -1;
        render();
        justCheckedIndex = -1;
        store.save();
        if (currentView === 'projects') renderProjectsView();
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
      } catch (e) { console.error('toggleTask failed:', e); }
    }
    function deleteTask(index) {
      try {
        const taskToDelete = store.tasks[index];
        if (!taskToDelete) return;
        if (pendingUndo) {
          clearTimeout(pendingUndo.timeoutId);
          pendingUndo = null;
          hideUndoToast();
        }
        const el = document.getElementById('task-card-' + index);
        if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; }
        store.deleteTask(index);
        store.save();
        try { tg.HapticFeedback.impactOccurred('rigid'); } catch (e) {}
        pendingUndo = { task: taskToDelete, originalIndex: index, timeoutId: null };
        showUndoToast();
        pendingUndo.timeoutId = setTimeout(() => {
          if (pendingUndo) { pendingUndo = null; hideUndoToast(); }
        }, UNDO_DURATION);
        skipSlideIn = true;
        setTimeout(() => {
          render();
          skipSlideIn = false;
          if (currentView === 'projects') renderProjectsView();
        }, 250);
      } catch (e) { console.error('deleteTask failed:', e); }
    }
    function undoDelete() {
      try {
        if (!pendingUndo) return;
        clearTimeout(pendingUndo.timeoutId);
        const { task, originalIndex } = pendingUndo;
        pendingUndo = null;
        store.restoreTask(task, originalIndex);
        store.save();
        hideUndoToast();
        skipSlideIn = true;
        render();
        skipSlideIn = false;
        if (currentView === 'projects') renderProjectsView();
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
      } catch (e) { console.error('undoDelete failed:', e); }
    }

      document.querySelectorAll('.tab-item').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
      });

      document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
      document.getElementById('edit-save').addEventListener('click', saveEdit);
      document.getElementById('edit-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'edit-overlay') closeEditModal();
      });
      const editTimeEl = document.getElementById('edit-time');
      editTimeEl.addEventListener('input', updateEditTimeBtn);
      editTimeEl.addEventListener('change', updateEditTimeBtn);

      document.getElementById('cat-toggle').addEventListener('click', () => openProjectSheet('add'));
      document.getElementById('edit-cat-toggle').addEventListener('click', () => openProjectSheet('edit'));

      document.getElementById('undo-toast-btn').addEventListener('click', undoDelete);
    }

    function startTick() {
      setInterval(() => {
        try {
          if (currentView === 'tasks') {
            updateDayFocus(store.filterTasks(selectedDate, currentFilter));
          }
        } catch (e) {}
      }, 60000);
    }

    function bootstrap() {
      try { restoreState(); } catch (e) { console.error('restoreState:', e); }

      try { buildWheels(); } catch (e) { console.error('buildWheels:', e); }
      try { buildCalendar(); } catch (e) { console.error('buildCalendar:', e); }
      try { updateTimeBtn(); } catch (e) { console.error('updateTimeBtn:', e); }
      try { updateProjectUI(); } catch (e) { console.error('updateProjectUI:', e); }
      try { updateEditProjectToggleUI(); } catch (e) { console.error('updateEditProjectToggleUI:', e); }
      try { initHandlers(); } catch (e) { console.error('initHandlers:', e); }

      if (currentView === 'projects') {
        try {
          document.getElementById('view-tasks').classList.remove('active');
          document.getElementById('view-projects').classList.add('active');
          document.querySelectorAll('.tab-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === 'projects');
          });
        } catch (e) { console.error('view switch:', e); }
      }

      setTimeout(playWelcome, 40);
      startTick();

      store.init()
        .then(() => {
          try { updateProjectUI(); } catch (e) {}
          try { updateEditProjectToggleUI(); } catch (e) {}
          try { updateCalendarDots(); } catch (e) {}
          try { render(); } catch (e) {}
          try { renderProjectsView(); } catch (e) {}
        })
        .catch((e) => {
          console.error('store.init failed:', e);
          try { render(); } catch (e2) {}
          try { renderProjectsView(); } catch (e2) {}
        });

      setTimeout(() => {
        if (document.body.classList.contains('booting')) {
          console.warn('booting still present after 4s — force removal');
          document.body.classList.remove('booting');
          document.body.classList.remove('welcome-open');
          const screen = document.getElementById('welcome-screen');
          if (screen) screen.style.display = 'none';
        }
      }, 4000);
    }

    bootstrap();
  </script>
</body>
</html>
