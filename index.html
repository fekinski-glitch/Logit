<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Logit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    /* ============================================================
       MAC OS 9 (PLATINUM) THEME
       ============================================================ */
    :root {
      --bg-color: #dddddd;
      --text-color: #000000;
      --hint-color: #666666;
      --button-color: #3366cc;
      --button-text-color: #ffffff;
      --secondary-bg-color: #eeeeee;

      --accent-rgb: 51, 102, 204;
      --danger-rgb: 204, 0, 0;
      --danger-color: rgb(var(--danger-rgb));
      --danger-soft: rgba(var(--danger-rgb), 0.15);
      --accent-soft: rgba(var(--accent-rgb), 0.15);
      --separator: #808080;

      --bevel-light: #ffffff;
      --bevel-mid: #dddddd;
      --bevel-dark: #808080;
      --bevel-black: #000000;
      --sunken-bg: #ffffff;
      --pressed-bg: #bbbbbb;

      --shadow-card: 1px 1px 0 rgba(0, 0, 0, 0.28);
      --shadow-overlay: 3px 3px 0 rgba(0, 0, 0, 0.35);

      --r-pill: 4px;
      --r-sheet: 8px;
      --r-card: 4px;
      --r-input: 2px;
      --r-chip: 3px;
      --r-sm: 2px;

      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 48px;

      --fs-xs: 10px; --fs-sm: 11px; --fs-base: 12px; --fs-md: 13px;
      --fs-lg: 16px; --fs-xl: 20px; --fs-display: 32px;

      --font-main: "Geneva", "Charcoal", "Verdana", "Helvetica Neue", Helvetica, sans-serif;
      --font-mono: "Monaco", "Courier New", monospace;

      --ease-out: cubic-bezier(0.2, 0.9, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body[data-theme="dark"] {
      --bg-color: #2a2a2a;
      --text-color: #e8e8e8;
      --hint-color: #999999;
      --secondary-bg-color: #3a3a3a;
      --bevel-light: #555555;
      --bevel-mid: #3a3a3a;
      --bevel-dark: #111111;
      --sunken-bg: #1a1a1a;
      --pressed-bg: #222222;
      --separator: #555555;
      --accent-soft: rgba(var(--accent-rgb), 0.25);
      --shadow-card: 1px 1px 0 rgba(0, 0, 0, 0.6);
      --shadow-overlay: 3px 3px 0 rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: var(--fs-md);
      line-height: 1.4;
      letter-spacing: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }
    body.picker-open, body.welcome-open { overflow: hidden; }
    body.booting .view, body.booting .tab-bar { visibility: hidden; }

    ::placeholder { color: var(--hint-color); opacity: 1; }

    :focus-visible {
      outline: 1px dotted var(--bevel-black);
      outline-offset: 1px;
    }

    .view {
      display: none;
      padding: var(--sp-4) var(--sp-4) 120px;
      min-height: 100vh;
      position: relative;
      background: var(--bg-color);
    }
    .view.active { display: block; }
    body.kb-open .view { padding-bottom: var(--sp-7); }

    .header-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: var(--sp-3);
    }
    .header-wrap--with-nav {
      justify-content: space-between;
      align-items: center;
      gap: var(--sp-2);
    }

    .pill {
      font-family: var(--font-main);
      font-size: var(--fs-md);
      font-weight: bold;
      padding: 6px 24px 6px 14px;
      background:
        repeating-linear-gradient(
          to bottom,
          var(--bevel-light) 0px,
          var(--bevel-light) 1px,
          #c8c8c8 1px,
          #c8c8c8 2px
        );
      border: 1px solid var(--bevel-black);
      border-radius: var(--r-pill);
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      letter-spacing: 0;
      color: var(--text-color);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-variant-numeric: tabular-nums;
      box-shadow:
        inset 1px 1px 0 var(--bevel-light),
        inset -1px -1px 0 var(--bevel-dark);
      position: relative;
      min-height: 26px;
    }
    .pill--interactive { cursor: pointer; }
    .pill--interactive:active {
      background: var(--pressed-bg);
      box-shadow:
        inset 1px 1px 0 var(--bevel-dark),
        inset -1px -1px 0 var(--bevel-light);
    }
    .pill .chevron {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 8px;
      opacity: 0.8;
    }
    #month-label {
      justify-content: center;
      padding: 6px 26px 6px 14px;
      flex: 1;
      max-width: 340px;
    }

    #category-pill {
      flex: 1;
      justify-content: center;
      display: flex;
      padding: 6px 26px 6px 14px;
      cursor: pointer;
    }
    #category-pill .cat-pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 1px;
      background: var(--hint-color);
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.35);
    }

    .icon-btn {
      width: 32px;
      height: 26px;
      border-radius: var(--r-sm);
      background: var(--bevel-mid);
      border: 1px solid var(--bevel-black);
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow:
        inset 1px 1px 0 var(--bevel-light),
        inset -1px -1px 0 var(--bevel-dark);
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }
    .icon-btn:active {
      background: var(--pressed-bg);
      box-shadow:
        inset 1px 1px 0 var(--bevel-dark),
        inset -1px -1px 0 var(--bevel-light);
      transform: translate(1px, 1px);
    }
    .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; }

    .header-icon-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      animation: fadeIn 0.22s var(--ease-out);
    }
    .header-icon-btn:active {
      transform: translateY(-50%) translate(1px, 1px);
    }
    .to-today-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      animation: fadeIn 0.22s var(--ease-out);
    }
    .to-today-btn:active {
      transform: translateY(-50%) translate(1px, 1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      visibility: hidden;
      opacity: 0;
      z-index: 1000;
      transition: opacity 0.2s, visibility 0.2s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-overlay.active { visibility: visible; opacity: 1; }
    .sheet {
      background: var(--bg-color);
      border: 1px solid var(--bevel-black);
      border-bottom: none;
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
      width: 100%;
      max-width: 500px;
      transform: translateY(100%);
      transition: transform 0.28s var(--ease-out);
      overflow: hidden;
      box-shadow:
        inset 1px 1px 0 var(--bevel-light),
        var(--shadow-overlay);
    }
    .sheet-overlay.active .sheet { transform: translateY(0); }
    .sheet--tall {
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet--bottom-pad {
      padding-bottom: calc(var(--sp-5) + env(safe-area-inset-bottom));
    }
    .picker-sheet--safe { padding-bottom: env(safe-area-inset-bottom); }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      border-bottom: 1px solid var(--bevel-black);
      background:
        repeating-linear-gradient(
          to bottom,
          var(--bevel-light) 0px,
          var(--bevel-light) 1px,
          #c8c8c8 1px,
          #c8c8c8 2px
        );
      flex-shrink: 0;
      min-height: 28px;
    }
    .sheet-header button {
      background: none;
      border: none;
      font-size: var(--fs-sm);
      font-weight: normal;
      letter-spacing: 0;
      font-family: inherit;
      cursor: pointer;
      padding: 2px 8px;
      -webkit-tap-highlight-color: transparent;
      color: var(--text-color);
      min-width: 60px;
      text-align: left;
      border-radius: var(--r-sm);
    }
    .sheet-header button:active { background: var(--accent-soft); }
    .sheet-title {
      font-size: var(--fs-md);
      font-weight: bold;
      letter-spacing: 0;
      color: var(--text-color);
      text-align: center;
    }
    .sheet-header-spacer { min-width: 60px; }
    .sheet-header .strong { font-weight: bold; text-align: right; }

    .cat-filter-list {
      padding: var(--sp-2) 0;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      background: var(--sunken-bg);
    }
    .cat-filter-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-2) var(--sp-4);
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      color: var(--text-color);
      min-height: 36px;
      font-size: var(--fs-md);
    }
    .cat-filter-item:active { background: var(--accent-soft); }
    .cat-filter-dot {
      width: 10px;
      height: 10px;
      border-radius: 1px;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.35);
    }
    .cat-filter-label { flex: 1; text-align: left; font-size: var(--fs-md); font-weight: normal; }
    .cat-filter-item.active .cat-filter-label { font-weight: bold; }
    .cat-filter-check {
      width: 16px; height: 16px;
      color: var(--button-color);
      opacity: 0;
      transition: opacity 0.1s;
      flex-shrink: 0;
    }
    .cat-filter-item.active .cat-filter-check { opacity: 1; }

    .cat-filter-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }
    .cat-filter-row:last-child { border-bottom: none; }
    .cat-filter-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      color: var(--text-color);
      text-align: left;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
      min-height: 36px;
      font-size: var(--fs-md);
    }
    .cat-filter-main:active { background: var(--accent-soft); }
    .cat-filter-row.active .cat-filter-main .cat-filter-label { font-weight: bold; }
    .cat-filter-row.active .cat-filter-main .cat-filter-check { opacity: 1; }
    .cat-filter-delete {
      width: 32px; height: 32px;
      margin-right: var(--sp-1);
      background: none;
      border: 1px solid transparent;
      color: var(--hint-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-sm);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .cat-filter-delete:active {
      color: var(--danger-color);
      background: var(--danger-soft);
      border-color: var(--bevel-black);
    }
    .cat-filter-delete svg { width: 14px; height: 14px; stroke: currentColor; }

    .project-new-wrap {
      padding: var(--sp-3);
      border-top: 1px solid var(--bevel-black);
      flex-shrink: 0;
      background: var(--bevel-mid);
    }
    .project-new-btn {
      width: 100%;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--bevel-mid);
      border: 1px solid var(--bevel-black);
      color: var(--text-color);
      font-family: inherit;
      font-size: var(--fs-md);
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        inset 1px 1px 0 var(--bevel-light),
        inset -1px -1px 0 var(--bevel-dark);
    }
    .project-new-btn:active {
      background: var(--pressed-bg);
      box-shadow:
        inset 1px 1px 0 var(--bevel-dark),
        inset -1px -1px 0 var(--bevel-light);
    }

    .project-popover-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      visibility: hidden;
      opacity: 0;
      z-index: 1100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      transition: opacity 0.2s, visibility 0.2s;
    }
    .project-popover-overlay.active { visibility: visible; opacity: 1; }
    .project-popover {
      background: var(--bg-color);
      border: 1px solid var(--bevel-black);
      border-radius: 6px;
      width: 100%;
      max-width: 320px;
      padding: 0;
      box-shadow:
        inset 1px 1px 0 var(--bevel-light),
        var(--shadow-overlay);
      transform: scale(0.9);
      opacity: 0;
      transition: transform 0.28s var(--ease-bounce), opacity 0.15s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .project-popover-overlay.active .project-popover { transform: scale(1); opacity: 1; }
    .project-popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 4px 10px;
      margin-bottom: var(--sp-4);
      border-bottom: 1px solid var(--bevel-black);
      background:
        repeating-linear-gradient(
          to bottom,
          var(--bevel-light) 0px,
          var(--bevel-light) 1px,
          #c8c8c8 1px,
          #c8c8c8 2px
        );
      min-height: 24px;
    }
    .project-popover-title {
      font-size: var(--fs-sm);
      font-weight: bold;
      color: var(--text-color);
    }
    .project-popover-close {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--bevel-mid);
      border: 1px solid var(--bevel-black);
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      box-shadow: inset 1px 1px 0 var(--bevel-light), inset -1px -1px 0 var(--bevel-dark);
    }
    .project-popover-close:active {
      background: var(--pressed-bg);
      box-shadow: inset 1px 1px 0 var(--bevel-dark), inset -1px -1px 0 var(--bevel-light);
    }
    .project-popover-close svg { width: 8px; height: 8px; }
    .project-popover-input {
      width: calc(100% - var(--sp-5));
      height: 26px;
      margin: 0 var(--sp-4);
      padding: 0 var(--sp-2);
      border-radius: var(--r-input);
      border: 1px solid var(--bevel-black);
      background: var(--sunken-bg);
      color: var(--text-color);
      font-family: var(--font-main);
      font-size: var(--fs-md);
      outline: none;
      box-shadow:
        inset 1px 1px 0 var(--bevel-dark),
        inset -1px -1px 0 var(--bevel-light);
    }
    .project-palette {
      display: flex;
      gap: var(--sp-2);
      justify-content: center;
      padding: var(--sp-4);
      flex-wrap: wrap;
    }
    .project-color-dot {
      width: 22px; height: 22px;
      border-radius: 2px;
      border: 1px solid var(--bevel-black);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.5), inset -1px -1px 0 rgba(0,0,0,0.3);
    }
    .project-color-dot.selected {
      outline: 2px solid var(--bevel-black);
      outline-offset: 1px;
      transform: scale(1.08);
    }
    .project-color-dot:active { transform: scale(1.15); }
    .project-popover-actions {
      display: flex;
      gap: var(--sp-2);
      padding: 0 var(--sp-4) var(--sp-4);
    }

    .btn-accent, .btn-ghost {
      flex: 1;
      height: 28px;
      border-radius: var(--r-sm);
      border: 1px solid var(--bevel-black);
      font-family: inherit;
      font-size: var(--fs-md);
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.35),
        inset -1px -1px 0 rgba(0,0,0,0.35);
    }
    .btn-accent {
      background: var(--button-color);
      color: var(--button-text-color);
    }
    .btn-accent:active {
      background: #2255aa;
      box-shadow:
        inset 1px 1px 0 rgba(0,0,0,0.35),
        inset -1px -1px 0 rgba(255,255,255,0.35);
      transform: translate(1px, 1px);
    }
    .btn-ghost {
      background: var(--bevel-mid);
      color: var(--text-color);
      box-shadow:
        inset 1px 1px 0 var(--bevel-light),
        inset -1px -1px 0 var(--bevel-dark);
    }
    .btn-ghost:active {
      background: var(--pressed-bg);
      box-shadow:
        inset 1px 1px 0 var(--bevel-dark),
        inset -1px -1px 0 var(--bevel-light);
      transform: translate(1px, 1px);
    }

    .calendar-strip-wrap {
      position: relative;
      margin-bottom: var(--sp-3);
    }
    .calendar-strip {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      padding: var(--sp-2) calc(50% - 24px);
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      background: var(--sunken-bg);
      border: 1px solid var(--bevel-black);
      border-radius: var(--r-sm);
      box-shadow:
        inset 1px 1px 0 var(--bevel-dark),
        inset -1px -1px 0 var(--bevel-light);
    }
    .calendar-strip::-webkit-scrollbar { display: none; }

    .day-cell {
      flex-shrink: 0;
      width: 46px;
      padding: 4px 0 2px;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      cursor: pointer;
      scroll-snap-align: center;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-color);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .day-cell .weekday {
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--hint-color);
      line-height: 1;
    }
    .day-cell.weekend:not(.selected) .weekday { color: var(--danger-color); }
    .day-cell .date-num {
      font-size: var(--fs-md);
      font-weight: bold;
      width: 28px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      border: 1px solid transparent;
      transition: all 0.1s;
      font-variant-numeric: tabular-nums;
    }
    .day-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--button-color);
      opacity: 0;
      transition: opacity 0.1s;
    }
    .day-cell.has-tasks .day-dot { opacity: 1; }
    .day-cell.selected { background: var(--button-color); }
    .day-cell.selected .day-dot { opacity: 0; }
    .day-cell.selected .date-num {
      background: var(--button-color);
      color: var(--button-text-color);
    }
    .day-cell.selected .weekday { color: #fff; }
    .day-cell.today:not(.selected) .date-num {
      color: var(--button-color);
      border-color: var(--button-color);
      border-style: dotted;
    }

    .calendar-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      padding: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    .calendar-arrow-left { left: -4px; }
    .calendar-arrow-right { right: -4px; }
    .calendar-strip-wrap.has-more-left .calendar-arrow-left,
    .calendar-strip-wrap.has-more-right .calendar-arrow-right {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) scale(1);
    }
    .calendar-arrow:active { transform: translateY(-50%) translate(1px, 1px) scale(1); }
    .calendar-arrow svg { width: 14px; height: 14px; stroke: currentColor; }

    #progress {
      text-align: center;
      font-size: var(--fs-sm);
      color: var(--hint-color);
      margin-bottom: var(--sp-3);
      min-height: 14px;
      font-variant-numeric: tabular-nums;
      padding: 0 var(--sp-1);
      line-height: 1.4;
    }

    .mini-timeline {
      position: relative;
      height: 44px;
      margin: 4px var(--sp-3) 8px;
      display: none;
    }
    .mini-timeline.visible { display: block; }
    .mini-timeline-track {
      position: absolute;
      left: 0; right: 0;
      top: 18px;
      height: 2px;
      background: var(--bevel-dark);
    }
    .mini-timeline-now {
      position: absolute;
      top: 10px;
      width: 2px;

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.colorScheme) document.body.setAttribute('data-theme', tg.colorScheme);

    const PALETTE = ['#cc4444','#cc8844','#cccc44','#44aa44','#4477cc','#8844cc','#44aaaa','#888888'];
    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const WEEKDAYS_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const TL_START_H = 5;
    const TL_END_H = 24;
    const TL_RANGE_MIN = (TL_END_H - TL_START_H) * 60;
    const UNDO_DURATION = 4000;
    const UI_STATE_KEY = 'logit_ui_state';
    const WELCOME_DONE_KEY = 'logit_welcome_done';
    const CLOUD_TIMEOUT_MS = 3000;

    const PARTICLE_GLOW_ALPHA = 0.28;
    const PARTICLE_CORE_ALPHA = 0.48;
    const PARTICLE_MAX = 2200;
    const PARTICLE_STEP = 3;
    const PARTICLE_ASSEMBLE_MS = 1400;
    const PARTICLE_MAX_DELAY_MS = 250;
    const PARTICLE_GLOW_SIZE_FACTOR = 6;

    function dateToISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function todayISO() { return dateToISO(new Date()); }
    function isoToDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function withTimeout(promise, ms) {
      return new Promise((resolve, reject) => {
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; reject(new Error('timeout')); } }, ms);
        promise.then(
          (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } },
          (e) => { if (!done) { done = true; clearTimeout(timer); reject(e); } }
        );
      });
    }

    class TaskStore {
      constructor() {
        this.tasks = [];
        this.projects = [];
        this.STORAGE_KEY = 'my_tasks_v3';
        this.FALLBACK_KEY = 'my_tasks_local_v3';
        this.OLD_STORAGE_KEY = 'my_tasks_v2';
        this.OLD_FALLBACK_KEY = 'my_tasks_local_v2';
        this.V1_STORAGE_KEY = 'my_tasks_v1';
        this.V1_FALLBACK_KEY = 'my_tasks_local_v1';
        this._initPromise = null;
        this.ready = false;
      }
      _defaults() {
        return [
          { id: 'personal', name: 'Личное', color: '#44aa44' },
          { id: 'work', name: 'Работа', color: '#cc8844' }
        ];
      }
      _id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
      _hasCloud() { return tg.CloudStorage && typeof tg.CloudStorage.getItem === 'function'; }
      async _cloudGet(key) {
        if (!this._hasCloud()) return null;
        try { return (await withTimeout(tg.CloudStorage.getItem(key), CLOUD_TIMEOUT_MS)) || null; }
        catch (e) { console.warn('cloudGet failed:', key, e && e.message); return null; }
      }
      _cloudSet(key, value) {
        if (!this._hasCloud()) return;
        withTimeout(tg.CloudStorage.setItem(key, value), CLOUD_TIMEOUT_MS)
          .catch((e) => console.warn('cloudSet failed:', key, e && e.message));
      }
      init() {
        if (!this._initPromise) {
          this._initPromise = this._load().catch((e) => {
            console.error('init failed:', e);
            this.tasks = [];
            this.projects = this._defaults();
            this.ready = true;
          });
        }
        return this._initPromise;
      }
      async _load() {
        let loaded = false;
        try {
          const saved = localStorage.getItem(this.FALLBACK_KEY);
          if (saved) {
            const data = JSON.parse(saved);
            if (data && typeof data === 'object' && !Array.isArray(data)) {
              this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
              this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
              loaded = true;
            }
          }
        } catch (e) { console.warn('local v3 load failed:', e && e.message); }
        if (!loaded) {
          try {
            const saved = await this._cloudGet(this.STORAGE_KEY);
            if (saved) {
              const data = JSON.parse(saved);
              if (data && typeof data === 'object' && !Array.isArray(data)) {
                this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
                this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
                loaded = true;
              }
            }
          } catch (e) { console.warn('cloud v3 load failed:', e && e.message); }
        }
        if (!loaded) {
          try {
            const saved = localStorage.getItem(this.OLD_FALLBACK_KEY);
            if (saved) {
              const data = JSON.parse(saved);
              if (data && typeof data === 'object' && !Array.isArray(data)) {
                this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
                this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
                loaded = true;
              }
            }
          } catch (e) {}
        }
        if (!loaded) {
          try {
            const saved = await this._cloudGet(this.OLD_STORAGE_KEY);
            if (saved) {
              const data = JSON.parse(saved);
              if (data && typeof data === 'object' && !Array.isArray(data)) {
                this.tasks = Array.isArray(data.tasks) ? data.tasks : [];
                this.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : this._defaults();
                loaded = true;
              }
            }
          } catch (e) {}
        }
        if (!loaded) {
          let oldTasks = null;
          try {
            const saved = localStorage.getItem(this.V1_FALLBACK_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed)) oldTasks = parsed;
            }
          } catch (e) {}
          if (!oldTasks) {
            try {
              const saved = await this._cloudGet(this.V1_STORAGE_KEY);
              if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) oldTasks = parsed;
              }
            } catch (e) {}
          }
          this.tasks = oldTasks || [];
          this.projects = this._defaults();
        }
        this._migrate();
        this.save();
        this.ready = true;
      }
      _migrate() {
        try {
          if (!this.projects || this.projects.length === 0) this.projects = this._defaults();
          this.tasks = this.tasks.map(t => {
            const updated = { ...t };
            if (!updated.id) updated.id = this._id();
            if (!updated.date) updated.date = todayISO();
            if (updated.time === undefined || updated.time === null) updated.time = '';
            if (!updated.projectId) {
              if (updated.category === 'work') updated.projectId = 'work';
              else updated.projectId = 'personal';
              if (updated.category !== undefined) delete updated.category;
            }
            if (!this.projects.find(p => p.id === updated.projectId)) {
              updated.projectId = this.projects[0].id;
            }
            return updated;
          });
        } catch (e) { console.error('migrate failed:', e); }
      }
      save() {
        try {
          const data = { tasks: this.tasks, projects: this.projects };
          const json = JSON.stringify(data);
          try { localStorage.setItem(this.FALLBACK_KEY, json); }
          catch (e) { console.error('localStorage save failed:', e); }
          this._cloudSet(this.STORAGE_KEY, json);
        } catch (e) { console.error('save failed:', e); }
      }
      getProject(id) {
        return this.projects.find(p => p.id === id) || this.projects[0] || { id: 'personal', name: 'Личное', color: '#44aa44' };
      }
      getProjectColor(id) { return this.getProject(id).color; }
      addTask(data) {
        const task = { id: this._id(), text: data.text, done: false, date: data.date, time: data.time || '', projectId: data.projectId };
        this.tasks.push(task);
        return task;
      }
      deleteTask(index) {
        if (index < 0 || index >= this.tasks.length) return null;
        return this.tasks.splice(index, 1)[0];
      }
      restoreTask(task, index) {
        if (!task) return;
        const at = Math.max(0, Math.min(index, this.tasks.length));
        this.tasks.splice(at, 0, task);
      }
      toggleTask(index) {
        if (index < 0 || index >= this.tasks.length) return null;
        this.tasks[index].done = !this.tasks[index].done;
        return this.tasks[index];
      }
      updateTask(index, updates) {
        if (index < 0 || index >= this.tasks.length) return null;
        Object.assign(this.tasks[index], updates);
        return this.tasks[index];
      }
      addProject(name, color) {
        const project = { id: 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, color };
        this.projects.push(project);
        return project;
      }
      deleteProject(id) {
        if (this.projects.length <= 1) return null;
        const project = this.projects.find(p => p.id === id);
        if (!project) return null;
        const fallback = this.projects.find(p => p.id !== id);
        if (!fallback) return null;
        this.tasks.forEach(t => { if (t.projectId === id) t.projectId = fallback.id; });

    function pluralForm(n, one, few, many) {
      const mod10 = n % 10;
      const mod100 = n % 100;

      if (mod10 === 1) return one;
      if (mod10 >= 2 && mod10 <= 4) return few;

      const d = isoToDate(iso);
      const today = new Date(); today.setHours(0,0,0,0);
      const diffDays = Math.round((d - today) / 86400000);
      let prefix;
      if (diffDays === 0) prefix = 'Сегодня';
      else if (diffDays === 1) prefix = 'Завтра';
      else if (diffDays === -1) prefix = 'Вчера';
      else { prefix = WEEKDAYS_FULL[d.getDay()]; prefix = prefix.charAt(0).toUpperCase() + prefix.slice(1); }
      return `${prefix}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;

    function buildDaySummaryLine() {
      const now = new Date();
      const hours = now.getHours();
      const isLateNight = hours >= 23;

      if (isLateNight) {
        const t = new Date(now);
        t.setDate(t.getDate() + 1);
        const targetISO = dateToISO(t);
        const tasks = store.tasks.filter(x => x.date === targetISO);
        if (tasks.length === 0) return 'Завтра свободно — можно отдохнуть';

        const total = tasks.length;
        const word = pluralForm(total, 'задача', 'задачи', 'задач');
        const withTime = tasks
          .filter(x => x.time)
          .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

        if (withTime.length > 0) {
          return 'Завтра ' + total + ' ' + word + ' · первая в ' + withTime[0].time;
        }
        return 'Завтра ' + total + ' ' + word;
      }

      const today = todayISO();
      const tasks = store.tasks.filter(x => x.date === today);
      if (tasks.length === 0) return 'Сегодня свободно — добавь первую';

      const total = tasks.length;
      const done = tasks.filter(x => x.done).length;
      if (done === total) return 'Все задачи на сегодня готовы 🎉';

      const nowMin = now.getHours() * 60 + now.getMinutes();
      const upcoming = tasks
        .filter(x => !x.done && x.time && timeToMinutes(x.time) > nowMin)
        .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

      if (upcoming.length > 0) {
        const remaining = total - done;
        const word = pluralForm(remaining, 'задача', 'задачи', 'задач');
        return 'Сегодня ' + remaining + ' ' + word + ' · ближайшая в ' + upcoming[0].time;
      }

      if (done > 0) return 'Сделано ' + done + ' из ' + total + ' — продолжай';

      return 'Сегодня ' + total + ' ' + pluralForm(total, 'задача', 'задачи', 'задач');
    }

    function runParticleAnimation(canvas) {
      return new Promise((resolve) => {
        try {
          const ctx = canvas.getContext('2d');
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const accent = getComputedStyle(document.documentElement).getPropertyValue('--button-color').trim() || '#3366cc';
          const glowSize = 64;
          const glowSprite = document.createElement('canvas');
          glowSprite.width = glowSize; glowSprite.height = glowSize;
          const gctx = glowSprite.getContext('2d');
          const grd = gctx.createRadialGradient(glowSize/2, glowSize/2, 0, glowSize/2, glowSize/2, glowSize/2);
          grd.addColorStop(0, accent);
          grd.addColorStop(0.18, accent);
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          gctx.fillStyle = grd;
          gctx.fillRect(0, 0, glowSize, glowSize);

          const off = document.createElement('canvas');
          off.width = w; off.height = h;
          const octx = off.getContext('2d');
          const fontSize = Math.min(w * 0.16, 64);
          octx.fillStyle = '#fff';
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          octx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif`;

          const word = 'LOGIT';
          const letterSpacing = fontSize * 0.15;
          const letterWidths = [];
          let totalW = 0;
          for (let i = 0; i < word.length; i++) {
            const lw = octx.measureText(word[i]).width;
            letterWidths.push(lw);
            totalW += lw + (i < word.length - 1 ? letterSpacing : 0);
          }
          let cx = w / 2 - totalW / 2;
          const cy = h * 0.28;
          for (let i = 0; i < word.length; i++) {
            octx.fillText(word[i], cx + letterWidths[i] / 2, cy);
            cx += letterWidths[i] + letterSpacing;
          }

          const data = octx.getImageData(0, 0, w, h).data;
          const targets = [];
          for (let y = 0; y < h; y += PARTICLE_STEP) {
            for (let x = 0; x < w; x += PARTICLE_STEP) {
              if (data[(y * w + x) * 4 + 3] > 128) targets.push({ x, y });
            }
          }
          let sampled = targets;
          if (targets.length > PARTICLE_MAX) {
            sampled = [];
            const stride = targets.length / PARTICLE_MAX;
            for (let i = 0; i < PARTICLE_MAX; i++) sampled.push(targets[Math.floor(i * stride)]);
          }

          const maxDelay = PARTICLE_MAX_DELAY_MS;
          const moveWindow = PARTICLE_ASSEMBLE_MS - maxDelay;
          const particles = sampled.map(t => {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.max(w, h) * (0.5 + Math.random() * 0.6);
            return {
              startX: w / 2 + Math.cos(angle) * radius,
              startY: h / 2 + Math.sin(angle) * radius,
              tx: t.x, ty: t.y, x: 0, y: 0,
              size: 1.2 + Math.random() * 1.3,
              delay: Math.random() * maxDelay
            };
          });

          const phaseStart = performance.now();
          function loop(now) {
            const elapsed = now - phaseStart;
            ctx.clearRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = accent;
            let allSettled = true;
            for (let i = 0; i < particles.length; i++) {
              const p = particles[i];
              const localT = Math.min(Math.max((elapsed - p.delay) / moveWindow, 0), 1);
              const ease = 1 - Math.pow(1 - localT, 3);
              p.x = p.startX + (p.tx - p.startX) * ease;
              p.y = p.startY + (p.ty - p.startY) * ease;
              if (localT < 1) allSettled = false;
              const drawSize = Math.max(10, p.size * PARTICLE_GLOW_SIZE_FACTOR);
              ctx.globalAlpha = PARTICLE_GLOW_ALPHA;
              ctx.drawImage(glowSprite, p.x - drawSize / 2, p.y - drawSize / 2, drawSize, drawSize);
              ctx.globalAlpha = PARTICLE_CORE_ALPHA;
              ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
            if (allSettled) { resolve({ w, h, fontSize, cy }); return; }
            requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);
        } catch (e) {
          console.error('particle anim failed:', e);
          resolve({ w: window.innerWidth, h: window.innerHeight, fontSize: 48, cy: window.innerHeight * 0.28 });
        }
      });
    }

    function buildProjectWeekStrip(project) {
      const todayDate = isoToDate(todayISO());

      const weekEl = document.createElement('div');
      weekEl.className = 'project-week';

      for (let i = 0; i < 7; i++) {
        const d = new Date(todayDate);
        d.setDate(d.getDate() + i);
        const iso = dateToISO(d);
        let pending = 0, done = 0;
        for (const t of store.tasks) {
          if (t.date === iso && t.projectId === project.id) {
            if (t.done) done++;
            else pending++;
          }
        }
        const dow = d.getDay();

        const dayBtn = document.createElement('button');
        dayBtn.type = 'button';
        dayBtn.className = 'project-week-day';
        dayBtn.dataset.date = iso;
        if (i === 0) dayBtn.classList.add('pw-today');
        if (dow === 0 || dow === 6) dayBtn.classList.add('pw-weekend');
        if (pending > 0) dayBtn.classList.add('pw-has-pending');
        else if (done > 0) dayBtn.classList.add('pw-has-done');
        else dayBtn.classList.add('pw-empty');

        dayBtn.innerHTML = `
          <span class="project-week-wd">${weekdays[dow]}</span>
          <span class="project-week-num">${d.getDate()}</span>
          <span class="project-week-indicator"></span>
        `;

        dayBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedDate = iso;
          currentFilter = project.id;
          addProjectId = project.id;
          saveState();
          buildCalendar();
          updateProjectPillUI();
          updateProjectToggleUI();
          staggerNextRender = true;
          render();
          switchView('tasks');
          try { tg.HapticFeedback.selectionChanged(); } catch (err) {}
        });

        weekEl.appendChild(dayBtn);
      }

      return weekEl;
    }

    function renderProjectsView() {
      try {
        const listEl = document.getElementById('projects-list');
        const emptyEl = document.getElementById('projects-empty');
        if (!listEl) return;
        listEl.innerHTML = '';

        if (!store.projects || store.projects.length === 0) {
          if (emptyEl) emptyEl.style.display = 'flex';
          return;
        }
        if (emptyEl) emptyEl.style.display = 'none';

        const today = todayISO();
        const rows = store.projects.map(p => {
          const allTasks = store.tasks.filter(t => t.projectId === p.id);
          const total = allTasks.length;
          const done = allTasks.filter(t => t.done).length;
          const todayTasks = allTasks.filter(t => t.date === today);
          const todayTotal = todayTasks.length;
          const todayDone = todayTasks.filter(t => t.done).length;
          return { project: p, total, done, todayTotal, todayDone };
        });

        rows.sort((a, b) => {
          if (b.todayTotal !== a.todayTotal) return b.todayTotal - a.todayTotal;
          return b.total - a.total;
        });

        const fragment = document.createDocumentFragment();
        rows.forEach(({ project, total, done, todayTotal, todayDone }) => {
          const percent = total > 0 ? Math.round((done / total) * 100) : 0;
          const card = document.createElement('div');
          card.className = 'project-card';
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.style.borderLeftColor = project.color;
          card.style.setProperty('--project-color', project.color);
          card.dataset.projectId = project.id;
          const statsText = total === 0
            ? 'нет задач'
            : done + ' из ' + total + ' · ' + percent + '%';
          const todayBadge = todayTotal > 0
            ? `<span class="project-card-today">${todayDone}/${todayTotal} сегодня</span>`
            : '';
          card.innerHTML = `
            <div class="project-card-header">
              <span class="project-card-dot" style="background: ${project.color};"></span>
              <span class="project-card-name">${escapeHtml(project.name)}</span>
              ${todayBadge}
            </div>
            <div class="project-card-bar">
              <div class="project-card-bar-fill" style="width: ${percent}%; --bar-color: ${project.color};"></div>
            </div>
            <div class="project-card-stats">${statsText}</div>
          `;

          card.appendChild(buildProjectWeekStrip(project));

          const handleCardClick = () => {
            currentFilter = project.id;
            addProjectId = project.id;
            saveState();
            updateProjectPillUI();
            updateProjectToggleUI();
            updateCalendarDots();
            render();
            if (currentView !== 'tasks') switchView('tasks');
            try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
          };
          card.addEventListener('click', handleCardClick);
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              handleCardClick();
            }
          });

          fragment.appendChild(card);
        });
        listEl.appendChild(fragment);
      } catch (e) { console.error('renderProjectsView failed:', e); }
    }

    function buildCalendar() {
      try {
        const base = isoToDate(selectedDate);
        base.setHours(0,0,0,0);
        const days = [];
        for (let i = -180; i <= 180; i++) {
          const d = new Date(base);
          d.setDate(d.getDate() + i);
          days.push(dateToISO(d));
        }
        calendarDays = days;
        renderCalendar();
      } catch (e) { console.error('buildCalendar failed:', e); }
    }
    function renderCalendar() {
      try {
        const strip = document.getElementById('calendar-strip');
        strip.innerHTML = '';
        const todayStr = todayISO();
        const weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        calendarDays.forEach(iso => {
          const d = isoToDate(iso);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'day-cell';
          if (iso === selectedDate) btn.classList.add('selected');
          if (iso === todayStr) btn.classList.add('today');
          const dow = d.getDay();
          if (dow === 0 || dow === 6) btn.classList.add('weekend');
          btn.dataset.date = iso;
          btn.innerHTML = `
            <span class="weekday">${weekdays[dow]}</span>
            <span class="date-num">${d.getDate()}</span>
            <span class="day-dot"></span>
          `;
          btn.addEventListener('click', () => selectDate(iso, true));
          strip.appendChild(btn);
        });
        requestAnimationFrame(() => scrollToSelected(false));
        attachScrollHandler();
        updateCalendarDots();
        setTimeout(updateCalendarFade, 150);
      } catch (e) { console.error('renderCalendar failed:', e); }
    }
    function updateCalendarDots() {
      try {
        document.querySelectorAll('.day-cell').forEach(cell => {
          const iso = cell.dataset.date;
          const hasPending = store.tasks.some(t => t.date === iso && !t.done && matchesCategory(t));
          cell.classList.toggle('has-tasks', hasPending);
        });
      } catch (e) {}
    }
    function attachScrollHandler() {
      try {
        const strip = document.getElementById('calendar-strip');
        if (!strip || strip.dataset.hasScrollHandler) return;
        strip.dataset.hasScrollHandler = '1';
        let timer;
        strip.addEventListener('scroll', () => {
          updateCalendarFade();
          if (suppressScrollSelect) return;
          clearTimeout(timer);
          timer = setTimeout(() => {
            const center = strip.scrollLeft + strip.clientWidth / 2;
            let closest = null, minDist = Infinity;
            strip.querySelectorAll('.day-cell').forEach(cell => {
              const cc = cell.offsetLeft + cell.offsetWidth / 2;
              const dist = Math.abs(cc - center);
              if (dist < minDist) { minDist = dist; closest = cell; }
            });
            if (closest && closest.dataset.date !== selectedDate) {
              selectDate(closest.dataset.date, false);
            }
          }, 120);
        }, { passive: true });
      } catch (e) {}
    }
    function updateCalendarFade() {
      try {
        const wrap = document.getElementById('calendar-strip-wrap');
        const strip = document.getElementById('calendar-strip');
        if (!wrap || !strip) return;
        const cells = strip.querySelectorAll('.day-cell');
        if (cells.length === 0) return;
        const stripRect = strip.getBoundingClientRect();
        const firstRect = cells[0].getBoundingClientRect();
        const lastRect = cells[cells.length - 1].getBoundingClientRect();
        wrap.classList.toggle('has-more-left', firstRect.left < stripRect.left - 8);
        wrap.classList.toggle('has-more-right', lastRect.right > stripRect.right + 8);
      } catch (e) {}
    }
    function scrollCalendarBy(dir) {
      try {
        const strip = document.getElementById('calendar-strip');
        if (!strip) return;
        strip.scrollBy({ left: dir * strip.clientWidth * 0.7, behavior: 'smooth' });
        try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
      } catch (e) {}
    }
    function scrollToSelected(smooth) {
      try {
        const strip = document.getElementById('calendar-strip');
        const sel = strip.querySelector('.selected');
        if (!sel) return;
        suppressScrollSelect = true;
        const target = sel.offsetLeft - strip.clientWidth / 2 + sel.clientWidth / 2;
        strip.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
        setTimeout(() => {
          suppressScrollSelect = false;
          updateCalendarFade();
        }, smooth ? 500 : 100);
      } catch (e) {}
    }
    function selectDate(iso, scroll) {
      if (iso === selectedDate) { if (scroll) scrollToSelected(true); return; }
      selectedDate = iso;
      saveState();
      document.querySelectorAll('.day-cell').forEach(cell => {
        cell.classList.toggle('selected', cell.dataset.date === iso);
      });
      staggerNextRender = true;
      render();
      if (scroll) scrollToSelected(true);
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }

    function buildWheels() {
      try {
        const currentYear = new Date().getFullYear();
        const mw = document.querySelector('#wheel-month .wheel-inner');
        mw.innerHTML = '';
        MONTHS.forEach((name, i) => {
          const el = document.createElement('div');
          el.className = 'wheel-item';
          el.dataset.value = i;
          el.textContent = name;
          mw.appendChild(el);
        });
        const yw = document.querySelector('#wheel-year .wheel-inner');
        yw.innerHTML = '';
        for (let y = currentYear - 10; y <= currentYear + 10; y++) {
          const el = document.createElement('div');
          el.className = 'wheel-item';
          el.dataset.value = y;
          el.textContent = y;
          yw.appendChild(el);
        }
        attachWheelScroll('wheel-month');
        attachWheelScroll('wheel-year');
      } catch (e) { console.error('buildWheels failed:', e); }
    }
    function getWheelValue(wheelId) {
      const wheel = document.getElementById(wheelId);
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closest = null, minDist = Infinity;
      wheel.querySelectorAll('.wheel-item').forEach(item => {
        const ic = item.offsetTop + item.offsetHeight / 2;
        const dist = Math.abs(ic - center);
        if (dist < minDist) { minDist = dist; closest = item; }
      });
      return closest ? parseInt(closest.dataset.value, 10) : null;
    }
    function updateWheelVisual(wheelId) {
      const wheel = document.getElementById(wheelId);
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closest = null, minDist = Infinity;
      wheel.querySelectorAll('.wheel-item').forEach(item => {
        const ic = item.offsetTop + item.offsetHeight / 2;
        const dist = Math.abs(ic - center);
        if (dist < minDist) { minDist = dist; closest = item; }
      });
      wheel.querySelectorAll('.wheel-item').forEach(el => el.classList.remove('active'));
      if (closest) closest.classList.add('active');
    }
    function scrollWheelTo(wheelId, value) {
      const wheel = document.getElementById(wheelId);
      const item = wheel.querySelector(`.wheel-item[data-value="${value}"]`);
      if (!item) return;
      wheel.scrollTop = item.offsetTop - wheel.clientHeight / 2 + item.offsetHeight / 2;
      updateWheelVisual(wheelId);
    }
    function attachWheelScroll(wheelId) {
      const wheel = document.getElementById(wheelId);
      let hapticTimer;
      let lastValue = getWheelValue(wheelId);
      const update = () => {
        updateWheelVisual(wheelId);
        const v = getWheelValue(wheelId);
        if (v !== null && v !== lastValue) {
          lastValue = v;
          clearTimeout(hapticTimer);
          hapticTimer = setTimeout(() => {
            try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
          }, 80);
        }
      };
      wheel.addEventListener('scroll', update, { passive: true });
      wheel.addEventListener('touchend', () => setTimeout(update, 50), { passive: true });
    }
    function openPicker() {
      const d = isoToDate(selectedDate);
      pickerMonth = d.getMonth();
      pickerYearValue = d.getFullYear();
      document.getElementById('picker-overlay').classList.add('active');
      document.body.classList.add('picker-open');
      setTimeout(() => {
        scrollWheelTo('wheel-month', pickerMonth);
        scrollWheelTo('wheel-year', pickerYearValue);
      }, 80);
    }
    function closePicker() {
      document.getElementById('picker-overlay').classList.remove('active');
      document.body.classList.remove('picker-open');
    }
    function applyPicker() {
      const m = getWheelValue('wheel-month');
      const y = getWheelValue('wheel-year');
      if (m !== null) pickerMonth = m;
      if (y !== null) pickerYearValue = y;
      jumpToMonthYear(pickerMonth, pickerYearValue);
      closePicker();
    }
    function jumpToMonthYear(monthIndex, year) {
      const current = isoToDate(selectedDate);
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      const day = Math.min(current.getDate(), lastDay);
      selectedDate = dateToISO(new Date(year, monthIndex, day));
      saveState();
      buildCalendar();
      staggerNextRender = true;
      render();
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    }

    function attachLongPress(card, index) {
      let startX = 0, startY = 0, moved = false, timer = null;
      card.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        moved = false;
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (!moved) {
            openEditModal(index);
            try { tg.HapticFeedback.impactOccurred('medium'); } catch (err) {}
          }
        }, 500);
      }, { passive: true });
      card.addEventListener('touchmove', (e) => {
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 || dy > 8) { moved = true; clearTimeout(timer); }
      }, { passive: true });
      card.addEventListener('touchend', () => clearTimeout(timer));
      card.addEventListener('touchcancel', () => clearTimeout(timer));
    }

    function renderTimeline(dayTasks) {
      try {
        const timeline = document.getElementById('mini-timeline');
        const dotsEl = document.getElementById('mini-timeline-dots');
        const labelsEl = document.getElementById('mini-timeline-labels');
        const timedTasks = dayTasks.filter(t => t.time);

        timeline.classList.add('visible');
        dotsEl.innerHTML = '';
        labelsEl.innerHTML = '';

        [6, 9, 12, 15, 18, 21].forEach(h => {
          const pct = ((h - TL_START_H) * 60) / TL_RANGE_MIN * 100;
          if (pct < 0 || pct > 100) return;
          const span = document.createElement('span');
          span.textContent = h;
          span.style.left = pct + '%';
          labelsEl.appendChild(span);
        });

        if (timedTasks.length > 0) {
          const nextTask = getNextUpcoming(timedTasks);
          timedTasks.forEach(task => {
            const pct = minutesToPct(timeToMinutes(task.time));
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'mini-timeline-dot';
            dot.style.left = pct + '%';
            dot.dataset.taskId = store.tasks.indexOf(task);
            dot.style.background = isOverdue(task) ? 'var(--danger-color)' : store.getProjectColor(task.projectId);
            if (task.done) dot.classList.add('done');
            if (nextTask && store.tasks.indexOf(task) === store.tasks.indexOf(nextTask)) dot.classList.add('next');
            dot.title = task.time + ' — ' + task.text;
            dot.addEventListener('click', () => scrollToTask(dot.dataset.taskId));
            dotsEl.appendChild(dot);
          });
        }

        updateNowMarker();
      } catch (e) { console.error('renderTimeline failed:', e); }
    }
    function getNextUpcoming(dayTasks) {
      if (selectedDate !== todayISO()) return null;
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const upcoming = dayTasks
        .filter(t => !t.done && t.time && timeToMinutes(t.time) > nowMin)
        .map(t => ({ task: t, min: timeToMinutes(t.time) }))
        .sort((a, b) => a.min - b.min)[0];
      return upcoming ? upcoming.task : null;
    }
    function updateNowMarker() {
      try {
        const nowEl = document.getElementById('mini-timeline-now');
        const timeline = document.getElementById('mini-timeline');
        if (!nowEl || !timeline.classList.contains('visible')) return;
        if (selectedDate !== todayISO()) { nowEl.style.display = 'none'; return; }
        const min = new Date().getHours() * 60 + new Date().getMinutes();
        if (min < TL_START_H * 60 || min > TL_END_H * 60) { nowEl.style.display = 'none'; return; }
        nowEl.style.display = 'block';
        nowEl.style.left = minutesToPct(min) + '%';
      } catch (e) {}
    }
    function scrollToTask(id) {
      try {
        const el = document.getElementById('task-card-' + id);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1000);
      } catch (e) {}
    }
    function updateDayFocus(dayTasks) {
      try {
        const progressEl = document.getElementById('progress');
        if (dayTasks.length === 0) { progressEl.textContent = ''; return; }
        const doneCount = dayTasks.filter(t => t.done).length;
        if (doneCount === dayTasks.length) { progressEl.textContent = 'Все выполнены 🎉'; return; }
        const next = getNextUpcoming(dayTasks.filter(t => t.time));
        if (next) {
          const text = next.text.length > 24 ? next.text.slice(0, 24) + '…' : next.text;
          progressEl.textContent = `Выполнено ${doneCount} из ${dayTasks.length} · Дальше: ${text} в ${next.time}`;
        } else {
          progressEl.textContent = `Выполнено ${doneCount} из ${dayTasks.length}`;
        }
      } catch (e) {}
    }

    function buildTaskCard(task, isNext, position, doStagger) {
      const globalIndex = store.tasks.indexOf(task);
      const overdue = isOverdue(task);
      const isJustChecked = justCheckedIndex === globalIndex;
      const borderColor = overdue ? 'var(--danger-color)' : store.getProjectColor(task.projectId);
      const wrapper = document.createElement('li');
      wrapper.className = 'task-item-wrapper';
      wrapper.id = 'task-card-' + globalIndex;
      if (skipSlideIn) wrapper.classList.add('no-slide');
      else if (doStagger) wrapper.style.animationDelay = (Math.min(position, 8) * 35) + 'ms';
      const badge = isNext ? '<span class="next-badge">дальше</span>' : '';
      const classes = [
        'task-card',
        task.done ? 'task-card--done' : '',
        overdue ? 'task-card--overdue' : '',
        isNext ? 'task-card--next' : ''
      ].filter(Boolean).join(' ');
      wrapper.innerHTML = `
        <div class="${classes}" style="border-left-color: ${borderColor}">
          <button type="button" class="task-checkbox${task.done ? ' checked' : ''}${isJustChecked ? ' just-checked' : ''}" aria-label="Готово" aria-checked="${task.done}"></button>
          <div class="task-content">
            <span class="task-text">${escapeHtml(task.text)}</span>
            ${task.time
              ? `<span class="task-time">${escapeHtml(task.time)}${badge}</span>`
              : `<span class="task-time empty">Без времени</span>`}
          </div>
          <button class="delete-btn" aria-label="Удалить">✕</button>
        </div>
      `;
      const card = wrapper.querySelector('.task-card');
      const checkbox = wrapper.querySelector('.task-checkbox');
      const crossBtn = wrapper.querySelector('.delete-btn');
      checkbox.addEventListener('click', (e) => { e.stopPropagation(); toggleTask(globalIndex); });
      crossBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTask(globalIndex); });
      attachLongPress(card, globalIndex);
      return wrapper;
    }

    function renderTasksList(dayTasks, nextTask, doStagger) {
      const sectionsEl = document.getElementById('task-sections');
      const emptyState = document.getElementById('empty-state');
      sectionsEl.innerHTML = '';
      if (dayTasks.length === 0) {
        emptyState.style.display = 'flex';
        const p = emptyState.querySelector('p');
        if (p) {
          if (currentFilter === 'all') p.textContent = 'На этот день задач нет';
          else p.textContent = 'В этом проекте на день задач нет';
        }
        return;
      }
      emptyState.style.display = 'none';
      const sections = { morning: [], day: [], evening: [], notime: [] };
      dayTasks.forEach(t => {
        if (!t.time) { sections.notime.push(t); return; }
        const h = parseInt(t.time.split(':')[0], 10);
        if (h >= 5 && h < 12) sections.morning.push(t);
        else if (h >= 12 && h < 17) sections.day.push(t);
        else sections.evening.push(t);
      });
      ['morning','day','evening','notime'].forEach(k => {
        sections[k].sort((a, b) => {
          if (!a.time && !b.time) return 0;
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });
      });
      const cfg = [
        { key: 'morning', title: 'Утро' },
        { key: 'day', title: 'День' },
        { key: 'evening', title: 'Вечер' },
        { key: 'notime', title: 'Без времени' }
      ];
      let cardPosition = 0;
      cfg.forEach(c => {
        const items = sections[c.key];
        if (items.length === 0) return;
        const sectionEl = document.createElement('div');
        sectionEl.className = 'time-section';
        const titleEl = document.createElement('div');
        titleEl.className = 'time-section-title';
        titleEl.innerHTML = `${c.title} <span class="time-section-count">${items.length}</span>`;
        const listEl = document.createElement('ul');
        listEl.className = 'section-task-list';
        items.forEach(t => {
          const isNext = nextTask && t === nextTask;
          listEl.appendChild(buildTaskCard(t, isNext, cardPosition, doStagger));
          cardPosition++;
        });
        sectionEl.appendChild(titleEl);
        sectionEl.appendChild(listEl);
        sectionsEl.appendChild(sectionEl);
      });
    }

    function render() {
      try {
        document.getElementById('month-label').innerHTML =
          formatMonthYear(selectedDate) + ' <span class="chevron">▼</span>';
        const btn = document.getElementById('to-today-btn');
        btn.style.display = selectedDate === todayISO() ? 'none' : 'flex';

        const dayTasks = store.filterTasks(selectedDate, currentFilter);
        const nextTask = getNextUpcoming(dayTasks.filter(t => t.time));
        const doStagger = staggerNextRender;
        staggerNextRender = false;

        renderTasksList(dayTasks, nextTask, doStagger);
        renderTimeline(dayTasks);
        updateDayFocus(dayTasks);
        updateCalendarDots();
      } catch (e) { console.error('render failed:', e); }
    }

    function addTask() {
      try {
        const input = document.getElementById('task-input');
        const timeInput = document.getElementById('task-time');
        const text = input.value.trim();
        if (!text) return;
        store.addTask({ text, date: selectedDate, time: timeInput.value || '', projectId: addProjectId });
        store.save();
        input.value = '';
        timeInput.value = '';
        updateTimeBtn();
        if (currentFilter !== 'all' && currentFilter !== addProjectId) {
          currentFilter = addProjectId;
          saveState();
          updateProjectPillUI();
        }
        render();
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
        input.blur();
      } catch (e) { console.error('addTask failed:', e); }
    }
    function toggleTask(index) {
      try {
        store.toggleTask(index);
        justCheckedIndex = store.tasks[index] && store.tasks[index].done ? index : -1;
        render();
        justCheckedIndex = -1;
        store.save();
        if (currentView === 'projects') renderProjectsView();
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
      } catch (e) { console.error('toggleTask failed:', e); }
    }
    function deleteTask(index) {
      try {
        const taskToDelete = store.tasks[index];
        if (!taskToDelete) return;
        if (pendingUndo) {
          clearTimeout(pendingUndo.timeoutId);
          pendingUndo = null;
          hideUndoToast();
        }
        const el = document.getElementById('task-card-' + index);
        if (el) { el.classList.add('removing'); el.style.pointerEvents = 'none'; }
        store.deleteTask(index);
        store.save();
        try { tg.HapticFeedback.impactOccurred('rigid'); } catch (e) {}
        pendingUndo = { task: taskToDelete, originalIndex: index, timeoutId: null };
        showUndoToast();
        pendingUndo.timeoutId = setTimeout(() => {
          if (pendingUndo) { pendingUndo = null; hideUndoToast(); }
        }, UNDO_DURATION);
        skipSlideIn = true;
        setTimeout(() => {
          render();
          skipSlideIn = false;
          if (currentView === 'projects') renderProjectsView();
        }, 250);
      } catch (e) { console.error('deleteTask failed:', e); }
    }
    function undoDelete() {
      try {
        if (!pendingUndo) return;
        clearTimeout(pendingUndo.timeoutId);
        const { task, originalIndex } = pendingUndo;
        pendingUndo = null;
        store.restoreTask(task, originalIndex);
        store.save();
        hideUndoToast();
        skipSlideIn = true;
        render();
        skipSlideIn = false;
        if (currentView === 'projects') renderProjectsView();
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
      } catch (e) { console.error('undoDelete failed:', e); }
    }
    function showUndoToast() { document.getElementById('undo-toast').classList.add('visible'); }
    function hideUndoToast() { document.getElementById('undo-toast').classList.remove('visible'); }

    function openEditModal(index) {
      editingIndex = index;
      const task = store.tasks[index];
      if (!task) return;
      document.getElementById('edit-text').value = task.text;
      document.getElementById('edit-time').value = task.time || '';
      editProjectId = task.projectId || (store.projects[0] && store.projects[0].id) || 'personal';
      updateEditProjectToggleUI();
      updateEditTimeBtn();
      document.getElementById('edit-overlay').classList.add('active');
      document.body.classList.add('picker-open');
    }
    function closeEditModal() {
      document.getElementById('edit-overlay').classList.remove('active');
      document.body.classList.remove('picker-open');
      editingIndex = -1;
    }
    function saveEdit() {
      try {
        if (editingIndex < 0) return;
        const text = document.getElementById('edit-text').value.trim();
        if (!text) return;
        store.updateTask(editingIndex, {
          text,
          time: document.getElementById('edit-time').value || '',
          projectId: editProjectId
        });
        store.save();
        const wasProjects = currentView === 'projects';
        closeEditModal();
        render();
        if (wasProjects) renderProjectsView();
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
      } catch (e) { console.error('saveEdit failed:', e); }
    }
    function updateEditTimeBtn() {
      const inp = document.getElementById('edit-time');
      const btn = document.getElementById('edit-time-btn-text');
      if (inp.value) { btn.textContent = inp.value; btn.classList.add('has-value'); }
      else { btn.textContent = 'Во сколько?'; btn.classList.remove('has-value'); }
    }
    function updateTimeBtn() {
      const timeInput = document.getElementById('task-time');
      const timeBtnText = document.getElementById('time-btn-text');
      if (timeInput.value) { timeBtnText.textContent = timeInput.value; timeBtnText.classList.add('has-value'); }
      else { timeBtnText.textContent = 'Во сколько?'; timeBtnText.classList.remove('has-value'); }
    }

    function switchView(view) {
      if (view === currentView) return;
      currentView = view;
      saveState();
      document.getElementById('view-tasks').classList.toggle('active', view === 'tasks');
      document.getElementById('view-projects').classList.toggle('active', view === 'projects');
      document.querySelectorAll('.tab-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      const activeBtn = document.querySelector('.tab-item[data-view="' + view + '"]');
      if (activeBtn) {
        activeBtn.classList.remove('tab-bounce');
        void activeBtn.offsetWidth;
        activeBtn.classList.add('tab-bounce');
        setTimeout(() => activeBtn.classList.remove('tab-bounce'), 400);
      }
      if (view === 'projects') renderProjectsView();
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }

    function initHandlers() {
      document.getElementById('welcome-start').addEventListener('click', () => {
        const screen = document.getElementById('welcome-screen');
        screen.classList.add('closing');
        document.body.classList.remove('welcome-open');
        if (isWelcomeDone() === false) markWelcomeDone();
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
        setTimeout(() => { screen.style.display = 'none'; }, 320);
      });

      document.getElementById('add-btn').addEventListener('click', addTask);
      document.getElementById('task-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTask();
      });
      const taskTimeEl = document.getElementById('task-time');
      taskTimeEl.addEventListener('input', updateTimeBtn);
      taskTimeEl.addEventListener('change', updateTimeBtn);

      document.getElementById('month-label').addEventListener('click', openPicker);
      document.getElementById('picker-cancel').addEventListener('click', closePicker);
      document.getElementById('picker-done').addEventListener('click', applyPicker);
      document.getElementById('picker-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'picker-overlay') closePicker();
      });

      document.getElementById('category-pill').addEventListener('click', () => openProjectSheet('filter'));
      document.getElementById('cat-filter-cancel').addEventListener('click', closeProjectSheet);
      document.getElementById('cat-filter-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'cat-filter-overlay') closeProjectSheet();
      });
      document.getElementById('project-new-btn').addEventListener('click', openNewProjectPopover);

      const popover = document.getElementById('project-popover-overlay');
      popover.addEventListener('click', (e) => {
        if (e.target.id === 'project-popover-overlay') closeNewProjectPopover();
      });
      document.getElementById('project-popover-close').addEventListener('click', closeNewProjectPopover);
      document.getElementById('project-popover-cancel').addEventListener('click', closeNewProjectPopover);
      document.getElementById('project-popover-create').addEventListener('click', createNewProject);
      document.getElementById('project-popover-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); createNewProject(); }
      });

      document.getElementById('to-today-btn').addEventListener('click', () => {
        selectedDate = todayISO();
        saveState();
        buildCalendar();
        staggerNextRender = true;
        render();
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
      });
      document.getElementById('calendar-arrow-left').addEventListener('click', (e) => {
        e.stopPropagation();
        scrollCalendarBy(-1);
      });
      document.getElementById('calendar-arrow-right').addEventListener('click', (e) => {
        e.stopPropagation();
        scrollCalendarBy(1);
      });

      document.getElementById('projects-add-btn').addEventListener('click', () => {
        projectSheetMode = 'filter';
        openNewProjectPopover();
      });

      document.querySelectorAll('.tab-item').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
      });

      document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
      document.getElementById('edit-save').addEventListener('click', saveEdit);
      document.getElementById('edit-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'edit-overlay') closeEditModal();
      });
      const editTimeEl = document.getElementById('edit-time');
      editTimeEl.addEventListener('input', updateEditTimeBtn);
      editTimeEl.addEventListener('change', updateEditTimeBtn);

      document.getElementById('cat-toggle').addEventListener('click', () => openProjectSheet('add'));
      document.getElementById('edit-cat-toggle').addEventListener('click', () => openProjectSheet('edit'));

      document.getElementById('undo-toast-btn').addEventListener('click', undoDelete);
    }

    function startTick() {
      setInterval(() => {
        try {
          if (currentView === 'tasks') {
            updateNowMarker();
            updateDayFocus(store.filterTasks(selectedDate, currentFilter));
          }
        } catch (e) {}
      }, 60000);
    }

    function bootstrap() {
      try { restoreState(); } catch (e) { console.error('restoreState:', e); }

      try { buildWheels(); } catch (e) { console.error('buildWheels:', e); }
      try { buildCalendar(); } catch (e) { console.error('buildCalendar:', e); }
      try { updateTimeBtn(); } catch (e) { console.error('updateTimeBtn:', e); }
      try { updateProjectUI(); } catch (e) { console.error('updateProjectUI:', e); }
      try { updateEditProjectToggleUI(); } catch (e) { console.error('updateEditProjectToggleUI:', e); }
      try { initHandlers(); } catch (e) { console.error('initHandlers:', e); }

      if (currentView === 'projects') {
        try {
          document.getElementById('view-tasks').classList.remove('active');
          document.getElementById('view-projects').classList.add('active');
          document.querySelectorAll('.tab-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === 'projects');
          });
        } catch (e) { console.error('view switch:', e); }
      }

      setTimeout(playWelcome, 40);
      startTick();

      store.init()
        .then(() => {
          try { updateProjectUI(); } catch (e) {}
          try { updateEditProjectToggleUI(); } catch (e) {}
          try { updateCalendarDots(); } catch (e) {}
          try { render(); } catch (e) {}
          try { renderProjectsView(); } catch (e) {}
        })
        .catch((e) => {
          console.error('store.init failed:', e);
          try { render(); } catch (e2) {}
          try { renderProjectsView(); } catch (e2) {}
        });

      setTimeout(() => {
        if (document.body.classList.contains('booting')) {
          console.warn('booting still present after 4s — force removal');
          document.body.classList.remove('booting');
          document.body.classList.remove('welcome-open');
          const screen = document.getElementById('welcome-screen');
          if (screen) screen.style.display = 'none';
        }
      }, 4000);
    }

    bootstrap();
  </script>
</body>
</html>
