<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Logit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #000000);
      --hint-color: var(--tg-theme-hint-color, #999999);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
      --danger-color: #ff3b30;
      --separator: rgba(128,128,128,0.2);
      --cat-personal: #34c759;
      --cat-work: #ff9f0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                   "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "kern" 1, "liga" 1;
      font-size: 17px;
      line-height: 1.4;
      letter-spacing: -0.2px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }
    body.picker-open { overflow: hidden; }
    body.welcome-open { overflow: hidden; }
    body.booting .view, body.booting .tab-bar { visibility: hidden; }

    ::placeholder { color: var(--hint-color); opacity: 1; letter-spacing: -0.2px; }

    .view {
      display: none;
      padding: 16px 16px 100px;
      min-height: 100vh;
      position: relative;
    }
    .view.active { display: block; }
    body.kb-open .view { padding-bottom: 32px; }

    .header-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    #month-label, .pill-static, #detail-date-pill {
      font-size: 15px;
      font-weight: 600;
      padding: 7px 14px;
      background: var(--secondary-bg-color);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
      color: var(--text-color);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
    }
    #month-label { cursor: pointer; transition: opacity 0.15s, transform 0.1s; border: none; }
    #month-label:active { opacity: 0.7; transform: scale(0.97); }
    #month-label .chevron, #detail-date-pill .chevron {
      font-size: 9px;
      opacity: 0.5;
      transform: translateY(1px);
    }

    .to-today-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--button-color);
      color: var(--button-text-color);
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      -webkit-tap-highlight-color: transparent;
      animation: fadeInBtn 0.25s ease;
    }
    .to-today-btn:active { transform: translateY(-50%) scale(0.92); }
    @keyframes fadeInBtn {
      from { opacity: 0; transform: translateY(-50%) scale(0.8); }
      to { opacity: 1; transform: translateY(-50%) scale(1); }
    }

    .category-pill-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
    #category-pill {
      font-size: 15px;
      font-weight: 600;
      padding: 7px 14px;
      background: var(--secondary-bg-color);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
      color: var(--text-color);
      cursor: pointer;
      user-select: none;
      font-family: inherit;
      border: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
      font-variant-numeric: tabular-nums;
    }
    #category-pill:active { opacity: 0.7; transform: scale(0.97); }
    #category-pill .cat-pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--hint-color);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #category-pill[data-cat="personal"] .cat-pill-dot { background: var(--cat-personal); }
    #category-pill[data-cat="work"] .cat-pill-dot { background: var(--cat-work); }
    #category-pill .chevron { font-size: 9px; opacity: 0.5; transform: translateY(1px); margin-left: 2px; }

    .cat-filter-overlay, .picker-overlay, .edit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      visibility: hidden;
      opacity: 0;
      z-index: 1000;
      transition: opacity 0.25s, visibility 0.25s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .cat-filter-overlay.active, .picker-overlay.active, .edit-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .cat-filter-sheet, .picker-sheet, .edit-sheet {
      background: var(--bg-color);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 500px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      overflow: hidden;
      box-shadow: 0 -2px 20px rgba(0,0,0,0.15);
    }
    .cat-filter-sheet, .picker-sheet { padding-bottom: env(safe-area-inset-bottom); }
    .edit-sheet { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .cat-filter-overlay.active .cat-filter-sheet,
    .picker-overlay.active .picker-sheet,
    .edit-overlay.active .edit-sheet { transform: translateY(0); }

    .cat-filter-header, .picker-header, .edit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--separator);
    }
    .cat-filter-header button, .picker-header button, .edit-header button {
      background: none;
      border: none;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.2px;
      font-family: inherit;
      cursor: pointer;
      padding: 6px 4px;
      -webkit-tap-highlight-color: transparent;
      color: var(--button-color);
      min-width: 60px;
      text-align: left;
    }
    .cat-filter-header button:active,
    .picker-header button:active,
    .edit-header button:active { opacity: 0.5; }
    .cat-filter-title, .picker-title, .edit-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text-color);
    }
    .cat-filter-spacer { min-width: 60px; }
    .picker-done, .edit-save { font-weight: 600; }

    .cat-filter-list { padding: 8px 0; }
    .cat-filter-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.15s;
      color: var(--text-color);
    }
    .cat-filter-item:active { background: var(--secondary-bg-color); }
    .cat-filter-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .cat-filter-label {
      flex: 1;
      text-align: left;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.2px;
    }
    .cat-filter-item.active .cat-filter-label { font-weight: 600; }
    .cat-filter-check {
      width: 22px;
      height: 22px;
      color: var(--button-color);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .cat-filter-item.active .cat-filter-check { opacity: 1; }

    .date-pill-wrapper {
      position: relative;
      display: inline-flex;
      transition: opacity 0.15s, transform 0.1s;
    }
    .date-pill-wrapper:active { opacity: 0.7; transform: scale(0.97); }
    .date-input-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: none;
      cursor: pointer;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
    }

    .calendar-strip-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .calendar-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px calc(50% - 26px);
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .calendar-strip::-webkit-scrollbar { display: none; }
    .calendar-strip-wrap::before,
    .calendar-strip-wrap::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32px;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .calendar-strip-wrap::before {
      left: 0;
      background: linear-gradient(to right, var(--bg-color) 0%, transparent 100%);
    }
    .calendar-strip-wrap::after {
      right: 0;
      background: linear-gradient(to left, var(--bg-color) 0%, transparent 100%);
    }
    .calendar-strip-wrap.has-more-left::before { opacity: 1; }
    .calendar-strip-wrap.has-more-right::after { opacity: 1; }

    .calendar-arrow {
      position: absolute;
      top: 50%;
      width: 44px;
      height: 44px;
      background: none;
      border: none;
      color: var(--hint-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      transform: translateY(-50%) scale(0.85);
    }
    .calendar-arrow-left { left: 6px; }
    .calendar-arrow-right { right: 6px; }
    .calendar-strip-wrap.has-more-left .calendar-arrow-left,
    .calendar-strip-wrap.has-more-right .calendar-arrow-right {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) scale(1);
    }
    .calendar-arrow:active { opacity: 0.55; }
    .calendar-arrow svg { width: 18px; height: 18px; stroke: currentColor; }

    .day-cell {
      flex-shrink: 0;
      width: 52px;
      padding: 6px 0 4px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: background-color 0.2s;
      scroll-snap-align: center;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .day-cell .weekday {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--hint-color);
      line-height: 1;
    }
    .day-cell.weekend:not(.selected) .weekday { color: var(--danger-color); }
    .day-cell .date-num {
      font-size: 17px;
      font-weight: 600;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: all 0.2s;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
    }
    .day-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--button-color);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .day-cell.has-tasks .day-dot { opacity: 1; }
    .day-cell.selected .day-dot { opacity: 0; }
    .day-cell.selected .date-num {
      background: var(--button-color);
      color: var(--button-text-color);
    }
    .day-cell.selected .weekday { color: var(--button-color); }
    .day-cell.today:not(.selected) .date-num {
      color: var(--button-color);
      border-color: var(--button-color);
    }

    #date-label {
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    #progress {
      text-align: center;
      font-size: 13px;
      font-weight: 400;
      color: var(--hint-color);
      margin-bottom: 14px;
      min-height: 16px;
      font-variant-numeric: tabular-nums;
      padding: 0 4px;
      line-height: 1.4;
    }

    .mini-timeline {
      position: relative;
      height: 48px;
      margin: 6px 12px 10px;
      display: none;
    }
    .mini-timeline.visible { display: block; }
    .mini-timeline-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 20px;
      height: 3px;
      background: var(--secondary-bg-color);
      border-radius: 2px;
    }
    .mini-timeline-now {
      position: absolute;
      top: 8px;
      width: 3px;
      height: 27px;
      background: var(--danger-color);
      border-radius: 2px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      box-shadow: 0 0 0 1px var(--bg-color);
      transition: left 0.5s ease;
    }
    .mini-timeline-dot {
      position: absolute;
      top: 16px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      z-index: 1;
      border: 2px solid var(--bg-color);
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, opacity 0.2s;
      padding: 0;
      background: var(--hint-color);
    }
    .mini-timeline-dot:active { transform: translateX(-50%) scale(1.3); }
    .mini-timeline-dot.done { opacity: 0.3; }
    .mini-timeline-dot[data-cat="personal"]:not(.overdue) { background: var(--cat-personal); }
    .mini-timeline-dot[data-cat="work"]:not(.overdue) { background: var(--cat-work); }
    .mini-timeline-dot.overdue { background: var(--danger-color); }
    .mini-timeline-dot.next {
      width: 13px;
      height: 13px;
      top: 15px;
      box-shadow: 0 0 0 3px var(--bg-color), 0 0 0 4.5px var(--button-color);
      z-index: 2;
      animation: pulseNext 2s ease infinite;
    }
    @keyframes pulseNext {
      0%, 100% { box-shadow: 0 0 0 3px var(--bg-color), 0 0 0 4.5px var(--button-color); }
      50% { box-shadow: 0 0 0 3px var(--bg-color), 0 0 0 6.5px var(--button-color); }
    }
    .mini-timeline-labels {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      height: 14px;
      pointer-events: none;
    }
    .mini-timeline-labels span {
      position: absolute;
      font-size: 9px;
      font-weight: 500;
      color: var(--hint-color);
      letter-spacing: 0.1px;
      transform: translateX(-50%);
      font-variant-numeric: tabular-nums;
    }

    #task-sections { display: flex; flex-direction: column; gap: 18px; }
    .time-section { display: flex; flex-direction: column; }
    .time-section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--hint-color);
      margin-bottom: 8px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .time-section-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--hint-color);
      opacity: 0.7;
      letter-spacing: 0;
      text-transform: none;
    }
    .section-task-list { list-style: none; display: flex; flex-direction: column; }

    .add-form { margin-bottom: 8px; }
    .add-form input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: none;
      background-color: var(--secondary-bg-color);
      color: var(--text-color);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.2px;
      font-family: inherit;
      outline: none;
      transition: box-shadow 0.2s;
    }
    .add-form input:focus { box-shadow: 0 0 0 2px var(--button-color); }
    .add-form-2 { display: flex; gap: 8px; margin-bottom: 22px; }

    .cat-toggle {
      height: 52px;
      padding: 0 12px;
      border-radius: 12px;
      border: none;
      background: var(--secondary-bg-color);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-toggle:active { opacity: 0.7; transform: scale(0.97); }
    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .cat-toggle[data-cat="personal"] .cat-dot { background: var(--cat-personal); }
    .cat-toggle[data-cat="work"] .cat-dot { background: var(--cat-work); }

    .time-btn-wrapper {
      flex: 1;
      height: 52px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      min-width: 0;
    }
    .time-btn-display {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background-color: var(--secondary-bg-color);
      color: var(--hint-color);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.2px;
      font-family: inherit;
      pointer-events: none;
      transition: color 0.2s;
    }
    .time-btn-display.has-value {
      color: var(--text-color);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .time-input-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: none;
      cursor: pointer;
      font-size: 17px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    .add-form-2 button#add-btn {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: none;
      background-color: var(--button-color);
      color: var(--button-text-color);
      font-size: 24px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      flex-shrink: 0;
      font-family: inherit;
      padding-bottom: 2px;
    }
    .add-form-2 button#add-btn:active { transform: scale(0.95); opacity: 0.8; }

    .task-item-wrapper {
      animation: slideIn 0.3s ease backwards;
      margin-bottom: 10px;
    }
    .section-task-list .task-item-wrapper:last-child { margin-bottom: 0; }
    .task-item-wrapper.no-slide { animation: none; }
    .task-item-wrapper.removing {
      animation: collapseOut 0.25s cubic-bezier(0.4, 0, 0.6, 1) forwards;
      pointer-events: none;
      overflow: hidden;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes collapseOut {
      0% { opacity: 1; max-height: 500px; margin-bottom: 10px; }
      100% { opacity: 0; max-height: 0; margin-bottom: 0; }
    }

    .task-item {
      display: flex;
      align-items: stretch;
      gap: 14px;
      padding: 16px 16px 16px 13px;
      background-color: var(--secondary-bg-color);
      border-radius: 14px;
      border-left: 3px solid transparent;
      -webkit-user-select: none;
      user-select: none;
      transition: border-color 0.2s, box-shadow 0.3s;
    }
    .task-item[data-cat="personal"] { border-left-color: var(--cat-personal); }
    .task-item[data-cat="work"] { border-left-color: var(--cat-work); }
    .task-item.overdue { border-left-color: var(--danger-color); }
    .task-item.next-task { box-shadow: 0 0 0 2px var(--button-color); }
    .task-item.flash { animation: flashHighlight 0.9s ease; }
    @keyframes flashHighlight {
      0%, 100% { box-shadow: none; }
      30% { box-shadow: 0 0 0 3px var(--button-color); }
    }
    .task-item.done { opacity: 0.55; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--hint-color); }
    .task-checkbox {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--hint-color);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 1px;
      transition: all 0.2s;
    }
    .task-checkbox.checked { background-color: var(--button-color); border-color: var(--button-color); }
    .task-checkbox.checked::after {
      content: "✓";
      color: var(--button-text-color);
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }
    .task-checkbox.just-checked { animation: checkboxPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes checkboxPop {
      0% { transform: scale(1); }
      35% { transform: scale(0.8); }
      65% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .task-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .task-text {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: -0.3px;
      word-break: break-word;
    }
    .task-time {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1px;
      color: var(--button-color);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .task-time.empty { color: var(--hint-color); font-weight: 500; font-size: 12px; }
    .task-item.overdue .task-time:not(.empty) { color: var(--danger-color); }
    .next-badge {
      display: inline-flex;
      align-items: center;

    }

      right: 0;

    .welcome-start-btn {

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.colorScheme) document.body.setAttribute('data-theme', tg.colorScheme);

    let tasks = [];
    const STORAGE_KEY = 'my_tasks_v1';

    const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    function makeTaskId() {

    }
    function todayISO() { return dateToISO(new Date()); }
    function dateToISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function isoToDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function formatDateLabel(iso) {
      const d = isoToDate(iso);
      const today = new Date(); today.setHours(0,0,0,0);
      const diffDays = Math.round((d - today) / 86400000);
      let prefix;
      if (diffDays === 0) prefix = 'Сегодня';
      else if (diffDays === 1) prefix = 'Завтра';
      else if (diffDays === -1) prefix = 'Вчера';
      else {
        prefix = WEEKDAYS_FULL[d.getDay()];
        prefix = prefix.charAt(0).toUpperCase() + prefix.slice(1);
      }
      return `${prefix}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
    }
    function formatMonthYear(iso) {
      const d = isoToDate(iso);
      return MONTHS[d.getMonth()].toUpperCase() + ' ' + d.getFullYear();
    }
    function isOverdue(task) {
      if (task.done || !task.time) return false;
      const d = isoToDate(task.date);
      const [h, m] = task.time.split(':').map(Number);
      d.setHours(h, m, 0, 0);
      return d < new Date();
    }

    function timeToMinutes(t) {

      const [h, m] = t.split(':').map(Number);

    }
    function minutesToPct(min) {

    (function setupKeyboardHandling() {
      const tabBar = document.getElementById('tab-bar');

        if (isOpen) {
          tabBar.classList.add('kb-hidden');

          tabBar.classList.remove('kb-hidden');
          document.body.classList.remove('kb-open');

      function isInputFocused() {
        const el = document.activeElement;
        if (!el) return false;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
      }
      document.addEventListener('focusin', (e) => {
        const el = e.target;
        if (!el) return;
        const tag = el.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) setKeyboardOpen(true);
      });
      document.addEventListener('focusout', () => {
        setTimeout(() => {
          if (!isInputFocused()) setKeyboardOpen(false);
        }, 120);
      });
      if (window.visualViewport) {
        const vv = window.visualViewport;
        let stableHeight = window.innerHeight;
        window.addEventListener('resize', () => {
          if (Math.abs(window.innerHeight - vv.height) < 100) stableHeight = window.innerHeight;
        });
        const onVpChange = () => {
          const isKb = (stableHeight - vv.height) > 150;
          if (isKb && isInputFocused()) setKeyboardOpen(true);
          else if (!isKb && !isInputFocused()) setKeyboardOpen(false);
        };
        vv.addEventListener('resize', onVpChange);
        vv.addEventListener('scroll', onVpChange);
      }
    })();

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function runParticleAnimation(canvas) {
      return new Promise((resolve) => {
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const accent = getComputedStyle(document.documentElement).getPropertyValue('--button-color').trim() || '#2481cc';

        const off = document.createElement('canvas');
        off.width = w;
        off.height = h;
        const octx = off.getContext('2d');
        const fontSize = Math.min(w * 0.16, 64);
        octx.fillStyle = '#fff';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif`;

        const word = 'LOGIT';
        const letterSpacing = fontSize * 0.15;
        const letterWidths = [];
        let totalW = 0;
        for (let i = 0; i < word.length; i++) {
          const lw = octx.measureText(word[i]).width;
          letterWidths.push(lw);
          totalW += lw + (i < word.length - 1 ? letterSpacing : 0);
        }
        let cx = w / 2 - totalW / 2;
        const cy = h * 0.28;
        for (let i = 0; i < word.length; i++) {
          octx.fillText(word[i], cx + letterWidths[i] / 2, cy);
          cx += letterWidths[i] + letterSpacing;
        }

        const data = octx.getImageData(0, 0, w, h).data;
        const step = 3;
        const targets = [];
        for (let y = 0; y < h; y += step) {
          for (let x = 0; x < w; x += step) {
            if (data[(y * w + x) * 4 + 3] > 128) targets.push({ x, y });
          }
        }

        let sampled = targets;
        const maxParticles = 2200;
        if (targets.length > maxParticles) {
          sampled = [];
          const stride = targets.length / maxParticles;
          for (let i = 0; i < maxParticles; i++) sampled.push(targets[Math.floor(i * stride)]);
        }

        const assembleDuration = 1400;
        const maxDelay = 250;
        const moveWindow = assembleDuration - maxDelay;

        const particles = sampled.map(t => {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.max(w, h) * (0.5 + Math.random() * 0.6);
          return {
            startX: w / 2 + Math.cos(angle) * radius,
            startY: h / 2 + Math.sin(angle) * radius,
            tx: t.x,
            ty: t.y,
            x: 0,
            y: 0,
            size: 1.2 + Math.random() * 1.3,
            delay: Math.random() * maxDelay
          };
        });

        const phaseStart = performance.now();
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}

        function loop(now) {
          const elapsed = now - phaseStart;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = accent;
          let allSettled = true;
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            const localT = Math.min(Math.max((elapsed - p.delay) / moveWindow, 0), 1);
            const ease = 1 - Math.pow(1 - localT, 3);
            p.x = p.startX + (p.tx - p.startX) * ease;
            p.y = p.startY + (p.ty - p.startY) * ease;
            if (localT < 1) allSettled = false;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
          }
          ctx.globalAlpha = 1;
          if (allSettled) {
            resolve({ w, h, fontSize, cy });
            return;
          }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      });
    }

    function buildCalendar() {
      const base = isoToDate(selectedDate);
      base.setHours(0,0,0,0);
      const days = [];
      for (let i = -180; i <= 180; i++) {
        const d = new Date(base);
        d.setDate(d.getDate() + i);
        days.push(dateToISO(d));
      }
      calendarDays = days;
      renderCalendar();
    }
    function renderCalendar() {
      const strip = document.getElementById('calendar-strip');
      strip.innerHTML = '';
      const todayStr = todayISO();
      const weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
      calendarDays.forEach(iso => {
        const d = isoToDate(iso);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-cell';
        if (iso === selectedDate) btn.classList.add('selected');
        if (iso === todayStr) btn.classList.add('today');
        const dow = d.getDay();
        if (dow === 0 || dow === 6) btn.classList.add('weekend');
        btn.dataset.date = iso;
        btn.innerHTML = `
          <span class="weekday">${weekdays[dow]}</span>
          <span class="date-num">${d.getDate()}</span>
          <span class="day-dot"></span>
        `;
        btn.addEventListener('click', () => selectDate(iso, true));
        strip.appendChild(btn);
      });
      requestAnimationFrame(() => scrollToSelected(false));
      attachScrollHandler();
      updateCalendarDots();
      setTimeout(updateCalendarFade, 150);
    }
    function updateCalendarDots() {
      document.querySelectorAll('.day-cell').forEach(cell => {
        const iso = cell.dataset.date;
        const hasPending = tasks.some(t => t.date === iso && !t.done && matchesCategory(t));
        cell.classList.toggle('has-tasks', hasPending);
      });
    }
    function attachScrollHandler() {
      const strip = document.getElementById('calendar-strip');
      if (strip.dataset.hasScrollHandler) return;
      strip.dataset.hasScrollHandler = '1';
      let timer;
      strip.addEventListener('scroll', () => {
        updateCalendarFade();
        if (suppressScrollSelect) return;
        clearTimeout(timer);
        timer = setTimeout(() => {
          const center = strip.scrollLeft + strip.clientWidth / 2;
          let closest = null, minDist = Infinity;
          strip.querySelectorAll('.day-cell').forEach(cell => {
            const cc = cell.offsetLeft + cell.offsetWidth / 2;
            const dist = Math.abs(cc - center);
            if (dist < minDist) { minDist = dist; closest = cell; }
          });
          if (closest && closest.dataset.date !== selectedDate) {
            selectDate(closest.dataset.date, false);
          }
        }, 120);
      }, { passive: true });
    }
    function updateCalendarFade() {
      const wrap = document.getElementById('calendar-strip-wrap');
      const strip = document.getElementById('calendar-strip');
      if (!wrap || !strip) return;
      const cells = strip.querySelectorAll('.day-cell');
      if (cells.length === 0) return;
      const stripRect = strip.getBoundingClientRect();
      const firstRect = cells[0].getBoundingClientRect();
      const lastRect = cells[cells.length - 1].getBoundingClientRect();
      const hasLeft = firstRect.left < stripRect.left - 8;
      const hasRight = lastRect.right > stripRect.right + 8;
      wrap.classList.toggle('has-more-left', hasLeft);
      wrap.classList.toggle('has-more-right', hasRight);
    }
    function scrollCalendarBy(dir) {
      const strip = document.getElementById('calendar-strip');
      if (!strip) return;
      const amount = strip.clientWidth * 0.7;
      strip.scrollBy({ left: dir * amount, behavior: 'smooth' });
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }
    function scrollToSelected(smooth) {
      const strip = document.getElementById('calendar-strip');
      const sel = strip.querySelector('.selected');
      if (!sel) return;
      suppressScrollSelect = true;
      const target = sel.offsetLeft - strip.clientWidth / 2 + sel.clientWidth / 2;
      strip.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
      setTimeout(() => {
        suppressScrollSelect = false;
        updateCalendarFade();
      }, smooth ? 500 : 100);
    }
    function selectDate(iso, scroll) {
      if (iso === selectedDate) {
        if (scroll) scrollToSelected(true);
        return;
      }
      selectedDate = iso;
      saveState();
      document.querySelectorAll('.day-cell').forEach(cell => {
        cell.classList.toggle('selected', cell.dataset.date === iso);
      });
      staggerNextRender = true;
      render();
      if (scroll) scrollToSelected(true);
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }

    function buildWheels() {
      const currentYear = new Date().getFullYear();
      const mw = document.querySelector('#wheel-month .wheel-inner');
      mw.innerHTML = '';
      MONTHS.forEach((name, i) => {
        const el = document.createElement('div');
        el.className = 'wheel-item';
        el.dataset.value = i;
        el.textContent = name;
        mw.appendChild(el);
      });
      const yw = document.querySelector('#wheel-year .wheel-inner');
      yw.innerHTML = '';
      for (let y = currentYear - 10; y <= currentYear + 10; y++) {
        const el = document.createElement('div');
        el.className = 'wheel-item';
        el.dataset.value = y;
        el.textContent = y;
        yw.appendChild(el);
      }
      attachWheelScroll('wheel-month');
      attachWheelScroll('wheel-year');
    }
    function getWheelValue(wheelId) {
      const wheel = document.getElementById(wheelId);
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closest = null, minDist = Infinity;
      wheel.querySelectorAll('.wheel-item').forEach(item => {
        const ic = item.offsetTop + item.offsetHeight / 2;
        const dist = Math.abs(ic - center);
        if (dist < minDist) { minDist = dist; closest = item; }
      });
      if (!closest) return null;
      return parseInt(closest.dataset.value, 10);
    }
    function updateWheelVisual(wheelId) {
      const wheel = document.getElementById(wheelId);
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closest = null, minDist = Infinity;
      wheel.querySelectorAll('.wheel-item').forEach(item => {
        const ic = item.offsetTop + item.offsetHeight / 2;
        const dist = Math.abs(ic - center);
        if (dist < minDist) { minDist = dist; closest = item; }
      });
      wheel.querySelectorAll('.wheel-item').forEach(el => el.classList.remove('active'));
      if (closest) closest.classList.add('active');
    }
    function scrollWheelTo(wheelId, value) {
      const wheel = document.getElementById(wheelId);
      const item = wheel.querySelector(`.wheel-item[data-value="${value}"]`);
      if (!item) return;
      const target = item.offsetTop - wheel.clientHeight / 2 + item.offsetHeight / 2;
      wheel.scrollTop = target;
      updateWheelVisual(wheelId);
    }
    function attachWheelScroll(wheelId) {
      const wheel = document.getElementById(wheelId);
      let hapticTimer;
      let lastValue = getWheelValue(wheelId);
      const update = () => {
        updateWheelVisual(wheelId);
        const v = getWheelValue(wheelId);
        if (v !== null && v !== lastValue) {
          lastValue = v;
          clearTimeout(hapticTimer);
          hapticTimer = setTimeout(() => {
            try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
          }, 80);
        }
      };
      wheel.addEventListener('scroll', update, { passive: true });
      wheel.addEventListener('touchend', () => setTimeout(update, 50), { passive: true });
    }
    function openPicker() {
      const d = isoToDate(selectedDate);
      pickerMonth = d.getMonth();
      pickerYearValue = d.getFullYear();
      document.getElementById('picker-overlay').classList.add('active');
      document.body.classList.add('picker-open');
      setTimeout(() => {
        scrollWheelTo('wheel-month', pickerMonth);
        scrollWheelTo('wheel-year', pickerYearValue);
      }, 80);
    }
    function closePicker() {
      document.getElementById('picker-overlay').classList.remove('active');
      document.body.classList.remove('picker-open');
    }
    function applyPicker() {
      const m = getWheelValue('wheel-month');
      const y = getWheelValue('wheel-year');
      if (m !== null) pickerMonth = m;
      if (y !== null) pickerYearValue = y;
      jumpToMonthYear(pickerMonth, pickerYearValue);
      closePicker();
    }
    function jumpToMonthYear(monthIndex, year) {
      const current = isoToDate(selectedDate);
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      const day = Math.min(current.getDate(), lastDay);
      selectedDate = dateToISO(new Date(year, monthIndex, day));
      saveState();
      buildCalendar();
      staggerNextRender = true;
      render();
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    }

    async function loadTasks() {
      try {
        if (tg.CloudStorage && typeof tg.CloudStorage.getItem === 'function') {
          const saved = await tg.CloudStorage.getItem(STORAGE_KEY);
          if (saved) {
            tasks = JSON.parse(saved);
            migrateTasks();
            render();
            if (currentView === 'detail') renderDetailView();
            return;
          }
        }
        const localSaved = localStorage.getItem(FALLBACK_KEY);
        if (localSaved) tasks = JSON.parse(localSaved);
      } catch (e) {
        console.error('Ошибка загрузки:', e);
        const localSaved = localStorage.getItem(FALLBACK_KEY);
        if (localSaved) tasks = JSON.parse(localSaved);
      }
      migrateTasks();
      render();
      if (currentView === 'detail') renderDetailView();
    }
    function migrateTasks() {
      let changed = false;
      tasks = tasks.map(t => {
        let updated = { ...t };
        if (!updated.id) { updated.id = makeTaskId(); changed = true; }
        if (!updated.date) { updated.date = todayISO(); changed = true; }
        if (updated.time === undefined || updated.time === null) { updated.time = ''; changed = true; }
        if (updated.category !== 'personal' && updated.category !== 'work') {
          updated.category = 'personal';
          changed = true;
        }
        return updated;
      });
      if (changed) saveTasks();
    }
    async function saveTasks() {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(tasks)); } catch (e) {}
      try {
        if (tg.CloudStorage && typeof tg.CloudStorage.setItem === 'function') {
          await tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }
      } catch (e) {}
    }

    function attachLongPress(card, index) {
      let startX = 0, startY = 0;
      let moved = false;
      let timer = null;
      card.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        moved = false;
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (!moved) {
            openEditModal(index);
            try { tg.HapticFeedback.impactOccurred('medium'); } catch (err) {}
          }
        }, 500);
      }, { passive: true });
      card.addEventListener('touchmove', (e) => {
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 || dy > 8) {
          moved = true;
          clearTimeout(timer);
        }
      }, { passive: true });
      card.addEventListener('touchend', () => clearTimeout(timer));
      card.addEventListener('touchcancel', () => clearTimeout(timer));
    }

    function renderTimeline(dayTasks) {
      const timeline = document.getElementById('mini-timeline');
      const dotsEl = document.getElementById('mini-timeline-dots');
      const labelsEl = document.getElementById('mini-timeline-labels');
      const nowEl = document.getElementById('mini-timeline-now');
      const timedTasks = dayTasks.filter(t => t.time);
      if (timedTasks.length === 0) {
        timeline.classList.remove('visible');
        nowEl.style.display = 'none';
        return;
      }
      timeline.classList.add('visible');
      dotsEl.innerHTML = '';
      labelsEl.innerHTML = '';
      [6, 9, 12, 15, 18, 21].forEach(h => {
        const pct = ((h - TL_START_H) * 60) / TL_RANGE_MIN * 100;
        if (pct < 0 || pct > 100) return;
        const span = document.createElement('span');
        span.textContent = h;
        span.style.left = pct + '%';
        labelsEl.appendChild(span);
      });
      const nextTask = getNextUpcoming(timedTasks);
      timedTasks.forEach(task => {
        const min = timeToMinutes(task.time);
        const pct = minutesToPct(min);
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'mini-timeline-dot';
        dot.style.left = pct + '%';
        dot.dataset.cat = task.category;
        dot.dataset.taskId = tasks.indexOf(task);
        if (task.done) dot.classList.add('done');
        if (isOverdue(task)) dot.classList.add('overdue');
        if (nextTask && tasks.indexOf(task) === tasks.indexOf(nextTask)) dot.classList.add('next');
        dot.title = task.time + ' — ' + task.text;
        dot.addEventListener('click', () => scrollToTask(dot.dataset.taskId));
        dotsEl.appendChild(dot);
      });
      updateNowMarker();
    }

    function getNextUpcoming(dayTasks) {
      if (selectedDate !== todayISO()) return null;
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const upcoming = dayTasks
        .filter(t => !t.done && t.time && timeToMinutes(t.time) > nowMin)
        .map(t => ({ task: t, min: timeToMinutes(t.time) }))
        .sort((a, b) => a.min - b.min)[0];
      return upcoming ? upcoming.task : null;
    }

    function updateNowMarker() {
      const nowEl = document.getElementById('mini-timeline-now');
      const timeline = document.getElementById('mini-timeline');
      if (!nowEl || !timeline.classList.contains('visible')) return;
      if (selectedDate !== todayISO()) { nowEl.style.display = 'none'; return; }
      const now = new Date();
      const min = now.getHours() * 60 + now.getMinutes();
      if (min < TL_START_H * 60 || min > TL_END_H * 60) { nowEl.style.display = 'none'; return; }
      const pct = minutesToPct(min);
      nowEl.style.display = 'block';
      nowEl.style.left = pct + '%';
    }

    function scrollToTask(id) {
      const el = document.getElementById('task-card-' + id);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1000);
    }

    function updateDayFocus(dayTasks) {
      const progressEl = document.getElementById('progress');
      if (dayTasks.length === 0) { progressEl.textContent = ''; return; }
      const doneCount = dayTasks.filter(t => t.done).length;
      if (doneCount === dayTasks.length) {
        progressEl.textContent = 'Все выполнены 🎉';
        return;
      }
      const next = getNextUpcoming(dayTasks.filter(t => t.time));
      if (next) {
        const text = next.text.length > 24 ? next.text.slice(0, 24) + '…' : next.text;
        progressEl.textContent = `Выполнено ${doneCount} из ${dayTasks.length} · Дальше: ${text} в ${next.time}`;
      } else {
        progressEl.textContent = `Выполнено ${doneCount} из ${dayTasks.length}`;
      }
    }

    function buildTaskCard(task, isNext, position, doStagger) {
      const globalIndex = tasks.indexOf(task);
      const overdue = isOverdue(task);
      const isJustChecked = justCheckedIndex === globalIndex;
      const wrapper = document.createElement('li');
      wrapper.className = 'task-item-wrapper';
      wrapper.id = 'task-card-' + globalIndex;
      if (skipSlideIn) wrapper.classList.add('no-slide');
      else if (doStagger) wrapper.style.animationDelay = (Math.min(position, 8) * 35) + 'ms';
      const badge = isNext ? '<span class="next-badge">дальше</span>' : '';
      wrapper.innerHTML = `
        <div class="task-item${task.done ? ' done' : ''}${overdue ? ' overdue' : ''}${isNext ? ' next-task' : ''}"
             data-cat="${task.category}">
          <div class="task-checkbox${task.done ? ' checked' : ''}${isJustChecked ? ' just-checked' : ''}"></div>
          <div class="task-content">
            <span class="task-text">${escapeHtml(task.text)}</span>
            ${task.time
              ? `<span class="task-time">${escapeHtml(task.time)}${badge}</span>`
              : `<span class="task-time empty">Без времени</span>`}
          </div>
          <button class="delete-btn">✕</button>
        </div>
      `;
      const card = wrapper.querySelector('.task-item');
      const checkbox = wrapper.querySelector('.task-checkbox');
      const crossBtn = wrapper.querySelector('.delete-btn');
      checkbox.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleTask(globalIndex);
      });
      crossBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(globalIndex);
      });
      attachLongPress(card, globalIndex);
      return wrapper;
    }

    function render() {
      document.getElementById('month-label').innerHTML =
        formatMonthYear(selectedDate) + ' <span class="chevron">▼</span>';
      updateToTodayBtn();

      const sectionsEl = document.getElementById('task-sections');
      const emptyState = document.getElementById('empty-state');
      document.getElementById('date-label').textContent = formatDateLabel(selectedDate);

      const dayTasks = tasks.filter(t => t.date === selectedDate && matchesCategory(t));
      const sections = { morning: [], day: [], evening: [], notime: [] };
      dayTasks.forEach(t => {
        if (!t.time) { sections.notime.push(t); return; }
        const h = parseInt(t.time.split(':')[0], 10);
        if (h >= 5 && h < 12) sections.morning.push(t);
        else if (h >= 12 && h < 17) sections.day.push(t);
        else sections.evening.push(t);
      });
      ['morning','day','evening','notime'].forEach(k => {
        sections[k].sort((a, b) => {
          if (!a.time && !b.time) return 0;
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });
      });
      const nextTask = getNextUpcoming(dayTasks.filter(t => t.time));
      const doStagger = staggerNextRender;
      staggerNextRender = false;

      sectionsEl.innerHTML = '';
      if (dayTasks.length === 0) {
        emptyState.style.display = 'block';
        if (currentCategory === 'personal') emptyState.textContent = 'Нет личных задач на этот день';
        else if (currentCategory === 'work') emptyState.textContent = 'Нет рабочих задач на этот день';
        else emptyState.textContent = 'На этот день задач нет';
      } else {
        emptyState.style.display = 'none';
        const cfg = [
          { key: 'morning', title: 'Утро' },
          { key: 'day', title: 'День' },
          { key: 'evening', title: 'Вечер' },
          { key: 'notime', title: 'Без времени' }
        ];
        let cardPosition = 0;
        cfg.forEach(c => {
          const items = sections[c.key];
          if (items.length === 0) return;
          const sectionEl = document.createElement('div');
          sectionEl.className = 'time-section';
          const titleEl = document.createElement('div');
          titleEl.className = 'time-section-title';
          titleEl.innerHTML = `${c.title} <span class="time-section-count">${items.length}</span>`;
          const listEl = document.createElement('ul');
          listEl.className = 'section-task-list';
          items.forEach(t => {
            const isNext = nextTask && t === nextTask;
            listEl.appendChild(buildTaskCard(t, isNext, cardPosition, doStagger));
            cardPosition++;
          });
          sectionEl.appendChild(titleEl);
          sectionEl.appendChild(listEl);
          sectionsEl.appendChild(sectionEl);
        });
      }
      renderTimeline(dayTasks);
      updateDayFocus(dayTasks);
      updateCalendarDots();
    }

    function updateToTodayBtn() {
      const btn = document.getElementById('to-today-btn');
      btn.style.display = selectedDate === todayISO() ? 'none' : 'flex';
    }

    function renderDetailView() {
      const d = isoToDate(detailDate);
      document.getElementById('detail-weekday').textContent = WEEKDAYS_FULL[d.getDay()];
      document.getElementById('detail-date-pill').innerHTML =
        d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + ' ' + d.getFullYear() +
        ' <span class="chevron">▼</span>';
      document.getElementById('detail-date-input').value = detailDate;

      const dayTasks = tasks.filter(t => t.date === detailDate && matchesCategory(t));
      const doneCount = dayTasks.filter(t => t.done).length;
      const total = dayTasks.length;
      const ring = document.getElementById('ring-fill');
      const percentEl = document.getElementById('ring-percent');
      const labelEl = document.getElementById('ring-label');

      if (total === 0) {
        ring.style.strokeDashoffset = CIRCUMFERENCE;
        percentEl.textContent = '—';
        labelEl.textContent = 'нет задач';
      } else {
        const percent = Math.round((doneCount / total) * 100);
        ring.style.strokeDashoffset = CIRCUMFERENCE - (percent / 100) * CIRCUMFERENCE;
        percentEl.textContent = percent + '%';
        labelEl.textContent = doneCount + ' из ' + total;
      }

      const list = document.getElementById('detail-task-list');
      const emptyEl = document.getElementById('detail-empty');
      list.innerHTML = '';
      if (dayTasks.length === 0) {
        emptyEl.style.display = 'block';
        if (currentCategory === 'personal') emptyEl.textContent = 'Нет личных задач на этот день';
        else if (currentCategory === 'work') emptyEl.textContent = 'Нет рабочих задач на этот день';
        else emptyEl.textContent = 'На этот день задач нет';
      } else {
        emptyEl.style.display = 'none';
        const sorted = [...dayTasks].sort((a, b) => {
          if (a.time && b.time) return a.time.localeCompare(b.time);
          if (a.time) return -1;
          if (b.time) return 1;
          return 0;
        });
        sorted.forEach(task => {
          const li = document.createElement('li');
          li.className = 'day-task-item' + (task.done ? ' done' : '');
          li.dataset.cat = task.category;
          li.innerHTML = `
            <div class="day-task-content">
              <span class="day-task-text">${escapeHtml(task.text)}</span>
              ${task.time
                ? `<span class="day-task-time">${escapeHtml(task.time)}</span>`
                : `<span class="day-task-time empty">Без времени</span>`}
            </div>
          `;
          list.appendChild(li);
        });
      }
    }

    function openEditModal(index) {
      editingIndex = index;
      const task = tasks[index];
      if (!task) return;
      document.getElementById('edit-text').value = task.text;
      document.getElementById('edit-time').value = task.time || '';
      editCategory = task.category || 'personal';
      updateEditCatToggleUI();
      updateEditTimeBtn();
      document.getElementById('edit-overlay').classList.add('active');
      document.body.classList.add('picker-open');
    }
    function closeEditModal() {
      document.getElementById('edit-overlay').classList.remove('active');
      document.body.classList.remove('picker-open');
      editingIndex = -1;
    }
    function saveEdit() {
      if (editingIndex < 0) return;
      const text = document.getElementById('edit-text').value.trim();
      if (!text) return;
      tasks[editingIndex].text = text;
      tasks[editingIndex].time = document.getElementById('edit-time').value || '';
      tasks[editingIndex].category = editCategory;
      const wasDetail = currentView === 'detail';
      closeEditModal();
      render();
      if (wasDetail) renderDetailView();
      saveTasks();
      try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
    }
    function updateEditTimeBtn() {
      const inp = document.getElementById('edit-time');
      const btn = document.getElementById('edit-time-btn-text');
      if (inp.value) {
        btn.textContent = inp.value;
        btn.classList.add('has-value');
      } else {
        btn.textContent = 'Во сколько?';
        btn.classList.remove('has-value');
      }
    }

    function updateTimeBtn() {
      const timeInput = document.getElementById('task-time');
      const timeBtnText = document.getElementById('time-btn-text');
      if (timeInput.value) {
        timeBtnText.textContent = timeInput.value;
        timeBtnText.classList.add('has-value');
      } else {
        timeBtnText.textContent = 'Во сколько?';
        timeBtnText.classList.remove('has-value');
      }
    }
    function addTask() {
      const input = document.getElementById('task-input');
      const timeInput = document.getElementById('task-time');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({
        id: makeTaskId(),
        text,
        done: false,
        date: selectedDate,
        time: timeInput.value || '',
        category: addCategory
      });
      input.value = '';
      timeInput.value = '';
      updateTimeBtn();
      if (currentCategory !== 'all' && currentCategory !== addCategory) {
        currentCategory = addCategory;
        saveState();
        updateCategoryUI();
      }
      render();
      saveTasks();
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      input.blur();
    }
    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      justCheckedIndex = tasks[index].done ? index : -1;
      render();
      justCheckedIndex = -1;
      saveTasks();
      try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
    }

    function deleteTask(index) {
      const taskToDelete = tasks[index];
      if (!taskToDelete) return;

      if (pendingUndo) {
        clearTimeout(pendingUndo.timeoutId);
        pendingUndo = null;
        hideUndoToast();
      }

      const el = document.getElementById('task-card-' + index);
      if (el) {
        el.classList.add('removing');
        el.style.pointerEvents = 'none';
      }

      tasks.splice(index, 1);
      saveTasks();
      try { tg.HapticFeedback.impactOccurred('rigid'); } catch (e) {}

      pendingUndo = { task: taskToDelete, originalIndex: index, timeoutId: null };
      showUndoToast();

      pendingUndo.timeoutId = setTimeout(() => {
        if (pendingUndo) {
          pendingUndo = null;
          hideUndoToast();
        }
      }, UNDO_DURATION);

      skipSlideIn = true;
      setTimeout(() => {
        render();
        skipSlideIn = false;
        if (currentView === 'detail') renderDetailView();
      }, 250);
    }

    function undoDelete() {
      if (!pendingUndo) return;
      clearTimeout(pendingUndo.timeoutId);
      const { task, originalIndex } = pendingUndo;
      pendingUndo = null;

      const insertAt = Math.min(originalIndex, tasks.length);
      tasks.splice(insertAt, 0, task);
      saveTasks();

      hideUndoToast();

      skipSlideIn = true;
      render();
      skipSlideIn = false;
      if (currentView === 'detail') renderDetailView();

      try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
    }

    function showUndoToast() {
      document.getElementById('undo-toast').classList.add('visible');
    }
    function hideUndoToast() {
      document.getElementById('undo-toast').classList.remove('visible');
    }

    const undoToastBtn = document.getElementById('undo-toast-btn');
    if (undoToastBtn) undoToastBtn.addEventListener('click', undoDelete);

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function switchView(view) {
      if (view === currentView) return;
      currentView = view;
      if (view === 'detail') detailDate = selectedDate;
      saveState();
      document.getElementById('view-tasks').classList.toggle('active', view === 'tasks');
      document.getElementById('view-detail').classList.toggle('active', view === 'detail');
      document.querySelectorAll('.tab-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      const activeBtn = document.querySelector('.tab-item[data-view="' + view + '"]');
      if (activeBtn) {
        activeBtn.classList.remove('tab-bounce');
        void activeBtn.offsetWidth;
        activeBtn.classList.add('tab-bounce');
        setTimeout(() => activeBtn.classList.remove('tab-bounce'), 400);
      }
      if (view === 'detail') renderDetailView();
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }

    const addBtnEl = document.getElementById('add-btn');
    if (addBtnEl) addBtnEl.addEventListener('click', addTask);

    const taskInputEl = document.getElementById('task-input');
    if (taskInputEl) taskInputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    const taskTimeEl = document.getElementById('task-time');
    if (taskTimeEl) {
      taskTimeEl.addEventListener('input', updateTimeBtn);
      taskTimeEl.addEventListener('change', updateTimeBtn);
    }

    const monthLabelEl = document.getElementById('month-label');
    if (monthLabelEl) monthLabelEl.addEventListener('click', openPicker);

    const pickerCancelEl = document.getElementById('picker-cancel');
    if (pickerCancelEl) pickerCancelEl.addEventListener('click', closePicker);

    const pickerDoneEl = document.getElementById('picker-done');
    if (pickerDoneEl) pickerDoneEl.addEventListener('click', applyPicker);

    const pickerOverlayEl = document.getElementById('picker-overlay');
    if (pickerOverlayEl) pickerOverlayEl.addEventListener('click', (e) => {
      if (e.target.id === 'picker-overlay') closePicker();
    });

    const categoryPillEl = document.getElementById('category-pill');
    if (categoryPillEl) categoryPillEl.addEventListener('click', openCategoryFilter);

    const catFilterCancelEl = document.getElementById('cat-filter-cancel');
    if (catFilterCancelEl) catFilterCancelEl.addEventListener('click', closeCategoryFilter);

    const catFilterOverlayEl = document.getElementById('cat-filter-overlay');
    if (catFilterOverlayEl) catFilterOverlayEl.addEventListener('click', (e) => {
      if (e.target.id === 'cat-filter-overlay') closeCategoryFilter();
    });

    document.querySelectorAll('.cat-filter-item').forEach(btn => {
      btn.addEventListener('click', () => {
        setFilter(btn.dataset.cat);
        closeCategoryFilter();
      });
    });

    const toTodayEl = document.getElementById('to-today-btn');
    if (toTodayEl) toTodayEl.addEventListener('click', () => {
      selectedDate = todayISO();
      saveState();
      buildCalendar();
      staggerNextRender = true;
      render();
      try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
    });

    const calArrowLeft = document.getElementById('calendar-arrow-left');
    if (calArrowLeft) calArrowLeft.addEventListener('click', (e) => {
      e.stopPropagation();
      scrollCalendarBy(-1);
    });

    const calArrowRight = document.getElementById('calendar-arrow-right');
    if (calArrowRight) calArrowRight.addEventListener('click', (e) => {
      e.stopPropagation();
      scrollCalendarBy(1);
    });

    const detailDateInputEl = document.getElementById('detail-date-input');
    if (detailDateInputEl) detailDateInputEl.addEventListener('change', (e) => {
      if (e.target.value) {
        detailDate = e.target.value;
        selectedDate = e.target.value;
        saveState();
        buildCalendar();
        staggerNextRender = true;
        render();
        renderDetailView();
        try { tg.HapticFeedback.impactOccurred('light'); } catch (err) {}
      }
    });

    document.querySelectorAll('.tab-item').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    const editCancelEl = document.getElementById('edit-cancel');
    if (editCancelEl) editCancelEl.addEventListener('click', closeEditModal);

    const editSaveEl = document.getElementById('edit-save');
    if (editSaveEl) editSaveEl.addEventListener('click', saveEdit);

    const editOverlayEl = document.getElementById('edit-overlay');
    if (editOverlayEl) editOverlayEl.addEventListener('click', (e) => {
      if (e.target.id === 'edit-overlay') closeEditModal();
    });

    const editTimeEl = document.getElementById('edit-time');
    if (editTimeEl) {
      editTimeEl.addEventListener('input', updateEditTimeBtn);
      editTimeEl.addEventListener('change', updateEditTimeBtn);
    }

    setInterval(() => {
      if (currentView === 'tasks') {
        updateNowMarker();
        const dayTasks = tasks.filter(t => t.date === selectedDate && matchesCategory(t));
        updateDayFocus(dayTasks);
      }
    }, 60000);

    setTimeout(() => {
      if (document.body.classList.contains('booting')) {
        document.body.classList.remove('booting');
        console.warn('booting not cleared by playWelcome — forced removal');
      }
    }, 5000);

    restoreState();
    detailDate = selectedDate;
    buildCalendar();
    buildWheels();
    updateTimeBtn();
    updateCategoryUI();
    updateCatToggleUI();
    updateEditCatToggleUI();
    if (currentView === 'detail') {
      document.getElementById('view-tasks').classList.remove('active');
      document.getElementById('view-detail').classList.add('active');
      document.querySelectorAll('.tab-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === 'detail');
      });
    }
    loadTasks();
    renderDetailView();

    setTimeout(playWelcome, 40);
  </script>
</body>
