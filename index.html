<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Logit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="booting">

  <div class="welcome-screen" id="welcome-screen">
    <canvas class="welcome-canvas" id="welcome-canvas"></canvas>
    <div class="welcome-check" id="welcome-check">✓</div>
    <div class="welcome-inner">
      <h1 class="welcome-greeting" id="welcome-greeting"></h1>
      <p class="welcome-subtitle" id="welcome-subtitle"></p>
      <button class="welcome-start-btn" id="welcome-start">Начать</button>
    </div>
  </div>

  <div class="view active" id="view-tasks">
    <div class="header-wrap">
      <h1 class="pill pill--interactive" id="month-label">Загрузка... <span class="chevron">▼</span></h1>
      <button class="icon-btn to-today-btn" id="to-today-btn" title="К сегодня">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <line x1="8" y1="3" x2="8" y2="7"/>
          <line x1="16" y1="3" x2="16" y2="7"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <circle cx="12" cy="15.5" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>

    <div class="calendar-strip-wrap" id="calendar-strip-wrap">
      <button class="icon-btn calendar-arrow calendar-arrow-left" id="calendar-arrow-left" aria-label="Раньше">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="calendar-strip" id="calendar-strip"></div>
      <button class="icon-btn calendar-arrow calendar-arrow-right" id="calendar-arrow-right" aria-label="Позже">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="mini-timeline" id="mini-timeline">
      <div class="mini-timeline-track"></div>
      <div class="mini-timeline-now" id="mini-timeline-now"></div>
      <div id="mini-timeline-dots"></div>
      <div class="mini-timeline-labels" id="mini-timeline-labels"></div>
    </div>

    <p id="progress"></p>

    <div class="category-pill-wrap" style="display: flex; margin-bottom: var(--sp-3);">
      <button class="pill" id="category-pill">
        <span class="cat-pill-dot" id="category-pill-dot"></span>
        <span id="category-pill-label">Все задачи</span>
        <span class="chevron">▼</span>
      </button>
    </div>

    <div class="add-form">
      <input type="text" id="task-input" placeholder="Что нужно сделать?" maxlength="100">
    </div>
    <div class="add-form-2">
      <button class="cat-toggle" id="cat-toggle">
        <span class="cat-dot" id="cat-toggle-dot"></span>
        <span id="cat-toggle-label">Личное</span>
      </button>
      <div class="time-btn-wrapper">
        <div class="time-btn-display" id="time-btn-text">Во сколько?</div>
        <input type="time" id="task-time" class="time-input-overlay">
      </div>
      <button id="add-btn">+</button>
    </div>

    <div id="task-sections"></div>
    <div id="empty-state">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 8 9 4"/>
        <line x1="13" y1="6" x2="21" y2="6"/>
        <polyline points="3 13 5 15 9 11"/>
        <line x1="13" y1="13" x2="21" y2="13"/>
        <polyline points="3 20 5 22 9 18"/>
        <line x1="13" y1="20" x2="21" y2="20"/>
      </svg>
      <p>На этот день задач нет</p>
    </div>
  </div>

  <div class="view" id="view-projects">
    <div class="header-wrap">
      <h1 class="pill" id="projects-title">Проекты</h1>
      <button class="icon-btn header-icon-btn" id="projects-add-btn" aria-label="Новый проект">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    <div id="projects-list"></div>
    <div id="projects-empty">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      <p>Нет проектов</p>
    </div>
  </div>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab-item active" data-view="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 8 9 4"/>
        <line x1="13" y1="6" x2="21" y2="6"/>
        <polyline points="3 13 5 15 9 11"/>
        <line x1="13" y1="13" x2="21" y2="13"/>
        <polyline points="3 20 5 22 9 18"/>
        <line x1="13" y1="20" x2="21" y2="20"/>
      </svg>
      <span>Задачи</span>
    </button>
    <button class="tab-item" data-view="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      <span>Проекты</span>
    </button>
  </nav>

  <div class="undo-toast" id="undo-toast">
    <span class="undo-toast-text" id="undo-toast-text">Задача удалена</span>
    <button class="undo-toast-btn" id="undo-toast-btn">Отменить</button>
  </div>

  <div class="sheet-overlay picker-overlay" id="picker-overlay">
    <div class="sheet picker-sheet--safe">
      <div class="sheet-header">
        <button id="picker-cancel">Отмена</button>
        <span class="sheet-title">Выбор месяца</span>
        <button class="strong" id="picker-done">Готово</button>
      </div>
      <div class="wheel-container">
        <div class="wheel-highlight"></div>
        <div class="wheel" id="wheel-month"><div class="wheel-inner"></div></div>
        <div class="wheel" id="wheel-year"><div class="wheel-inner"></div></div>
      </div>
    </div>
  </div>

  <div class="sheet-overlay cat-filter-overlay" id="cat-filter-overlay">
    <div class="sheet sheet--tall">
      <div class="sheet-header">
        <button id="cat-filter-cancel">Отмена</button>
        <span class="sheet-title" id="cat-filter-title">Проект</span>
        <span class="sheet-header-spacer"></span>
      </div>
      <div class="cat-filter-list" id="cat-filter-list"></div>
      <div class="project-new-wrap">
        <button class="project-new-btn" id="project-new-btn">+ Новый проект</button>
      </div>
    </div>
  </div>

  <div class="project-popover-overlay" id="project-popover-overlay">
    <div class="project-popover">
      <div class="project-popover-header">
        <span class="project-popover-title">Новый проект</span>
        <button class="project-popover-close" id="project-popover-close" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <input type="text" id="project-popover-input" class="project-popover-input" placeholder="Название проекта" maxlength="30">
      <div class="project-palette" id="project-popover-palette"></div>
      <div class="project-popover-actions">
        <button class="btn-ghost" id="project-popover-cancel">Отмена</button>
        <button class="btn-accent" id="project-popover-create">Создать</button>
      </div>
    </div>
  </div>

  <div class="sheet-overlay edit-overlay" id="edit-overlay">
    <div class="sheet sheet--bottom-pad">
      <div class="sheet-header">
        <button id="edit-cancel">Отмена</button>
        <span class="sheet-title">Редактировать</span>
        <button class="strong" id="edit-save">Готово</button>
      </div>
      <div class="edit-body">
        <input type="text" id="edit-text" class="edit-input" maxlength="100" placeholder="Что нужно сделать?">
        <div class="edit-row">
          <button class="cat-toggle" id="edit-cat-toggle">
            <span class="cat-dot" id="edit-cat-toggle-dot"></span>
            <span id="edit-cat-label">Личное</span>
          </button>
          <div class="time-btn-wrapper" style="flex:1;">
            <div class="time-btn-display" id="edit-time-btn-text">Во сколько?</div>
            <input type="time" id="edit-time" class="time-input-overlay">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
